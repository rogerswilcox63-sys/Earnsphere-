<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Surveys – EarnSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, .1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, .1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    #app {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
    }
    .navbar {
      background: rgba(30, 41, 59, .8);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.5rem;
      border-radius: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, .08);
    }
    .navbar .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }
    .navbar .logo i {
      margin-right: 0.3rem;
    }
    .navbar .nav-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .navbar .logout-btn {
      background: rgba(59, 130, 246, .2);
      border: 1px solid rgba(59, 130, 246, .3);
      padding: 0.35rem 0.9rem;
      border-radius: 2rem;
      font-weight: 500;
      color: #3b82f6;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s;
    }
    .navbar .logout-btn:hover {
      background: rgba(59, 130, 246, .3);
    }
    #userName {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-right: 0.5rem;
    }
    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .offer-card {
      background: rgba(30, 41, 59, .7);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 1.8rem;
      border: 1px solid rgba(255, 255, 255, .08);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
      cursor: default;
    }
    .offer-card:hover {
      transform: translateY(-4px);
      border-color: rgba(59, 130, 246, .3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    .offer-card .offer-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(16, 185, 129, .2);
      color: #10b981;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, .3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .offer-card .offer-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .offer-card .offer-title i {
      color: #3b82f6;
      font-size: 1.4rem;
    }
    .offer-card .offer-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .offer-card .offer-meta span {
      background: rgba(255, 255, 255, .05);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
    }
    .offer-card .offer-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin: 0.2rem 0 0.5rem;
    }
    .offer-card .offer-reward {
      font-size: 1.3rem;
      font-weight: 700;
      color: #10b981;
      margin-top: auto;
    }
    .offer-card .start-btn {
      margin-top: 0.5rem;
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      padding: 0.7rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      text-align: center;
      display: inline-block;
    }
    .offer-card .start-btn:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(59, 130, 246, .3);
    }
    .offer-card .start-btn:disabled {
      background: #334155;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .loading-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #94a3b8;
    }
    .loading-state i {
      font-size: 2.5rem;
      color: #3b82f6;
      display: block;
      margin-bottom: 1rem;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
    }
    .empty-state i {
      font-size: 2.5rem;
      color: #3b82f6;
      display: block;
      margin-bottom: 0.8rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .toast {
      background: rgba(30, 41, 59, .95);
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(16, 185, 129, .3);
      color: #fff;
      animation: slideIn 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .3);
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      max-width: 90%;
    }
    .toast.error {
      border-color: #ef4444;
    }
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        text-align: center;
      }
      .offers-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <a href="dashboard.html" class="logo"><i class="fas fa-coins"></i> EarnSphere</a>
      <div class="nav-right">
        <span id="userName">Loading...</span>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </nav>
    <div id="surveyContainer">
      <div class="loading-state">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading surveys...</p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
      authDomain: "earnspherehub-742e9.firebaseapp.com",
      projectId: "earnspherehub-742e9",
      storageBucket: "earnspherehub-742e9.firebasestorage.app",
      messagingSenderId: "173538573377",
      appId: "1:173538573377:web:6d8c748376afcb9096dac0"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // GLOBALS
    // ============================================================
    let currentUser = null;
    let userData = null;
    let allSurveys = [];

    // ============================================================
    // HELPERS
    // ============================================================
    function showToast(msg, isError = false) {
      const toast = document.createElement('div');
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function getTodayDateString() {
      return new Date().toISOString().split('T')[0];
    }

    function logout() {
      auth.signOut().then(() => {
        localStorage.removeItem('earnsphere_user_data');
        window.location.href = 'login.html';
      });
    }

    function isTaskCompleted(taskId) {
      if (!userData || !userData.completedTasks || !userData.completedTasks[taskId]) return false;
      const completedDate = new Date(userData.completedTasks[taskId]).toISOString().split('T')[0];
      return completedDate === getTodayDateString();
    }

    function getSurveyCountToday() {
      let count = 0;
      if (userData && userData.completedTasks) {
        const today = getTodayDateString();
        for (const [taskId, timestamp] of Object.entries(userData.completedTasks)) {
          if (taskId.startsWith('srv_') || taskId.startsWith('survey_')) {
            const compDate = new Date(timestamp).toISOString().split('T')[0];
            if (compDate === today) count++;
          }
        }
      }
      return count;
    }

    // ============================================================
    // FETCH SURVEYS
    // ============================================================
    async function fetchSurveys() {
      try {
        const snapshot = await db.collection('surveys')
          .where('active', '==', true)
          // .orderBy('createdAt', 'desc') // uncomment after index
          .get();

        const surveys = [];
        if (!snapshot.empty) {
          snapshot.forEach(doc => {
            const data = doc.data();
            surveys.push({
              id: doc.id,
              title: data.title || 'Untitled Survey',
              description: data.description || 'No description',
              reward: data.reward || 100,
              category: data.category || 'General',
              questions: data.questions || [],
              active: data.active !== false,
              createdAt: data.createdAt || null,
            });
          });
        }
        allSurveys = surveys;
        return surveys;
      } catch (e) {
        console.error('Error fetching surveys:', e);
        return [];
      }
    }

    // ============================================================
    // RENDER LIST
    // ============================================================
    function renderSurveyList(surveys) {
      const container = document.getElementById('surveyContainer');
      const dailyCount = getSurveyCountToday();

      if (surveys.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-clipboard-list"></i>
              <p>No active surveys available.</p>
              <p style="font-size:0.85rem;color:#94a3b8;margin-top:0.3rem;">Check back later for new opportunities.</p>
              <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
          `;
        return;
      }

      let html = `
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;">
            <h2 class="section-title"><i class="fas fa-poll"></i> Available Surveys</h2>
            <span style="font-size:0.9rem;color:#94a3b8;">${dailyCount}/2 completed today</span>
          </div>
          <div class="offers-grid">
        `;

      surveys.forEach(survey => {
        const completed = isTaskCompleted(survey.id);
        const isDisabled = completed || dailyCount >= 2;

        const categoryColor = survey.category === 'Tech' ? '#3b82f6' :
          survey.category === 'Finance' ? '#10b981' :
          survey.category === 'Entertainment' ? '#f59e0b' :
          survey.category === 'Lifestyle' ? '#8b5cf6' :
          survey.category === 'E-commerce' ? '#ec4899' :
          survey.category === 'Sports' ? '#f97316' :
          survey.category === 'Education' ? '#06b6d4' :
          '#3b82f6';

        html += `
            <div class="offer-card">
              <span class="offer-badge" style="background:${categoryColor}20;color:${categoryColor};border-color:${categoryColor}40;">
                ${survey.category || 'Survey'}
              </span>
              <div class="offer-title">
                <i class="fas fa-clipboard-list" style="color:${categoryColor};"></i>
                ${survey.title}
              </div>
              <div class="offer-meta">
                <span><i class="fas fa-clock"></i> ~5 min</span>
                <span><i class="fas fa-users"></i> ${Math.floor(Math.random() * 200) + 50} responses</span>
              </div>
              <p class="offer-desc">${survey.description}</p>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="offer-reward">₦${survey.reward}</span>
                <span style="font-size:0.8rem;color:#94a3b8;">${survey.questions ? survey.questions.length : 0} questions</span>
              </div>
              <a href="take-survey.html?id=${survey.id}" class="start-btn" ${isDisabled ? 'style="pointer-events:none;"' : ''}>
                ${completed ? '✅ Completed' : dailyCount >= 2 ? '⏳ Daily Limit' : '🚀 Start Survey'}
              </a>
            </div>
          `;
      });

      html += `</div>`;
      html += `<a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>`;
      container.innerHTML = html;
    }

    // ============================================================
    // MAIN INIT
    // ============================================================
    async function init() {
      const user = auth.currentUser;
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      document.getElementById('userName').textContent = user.displayName || user.email || 'User';

      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          userData = doc.data();
        } else {
          userData = { balance: 0, completedTasks: {} };
        }
      } catch (e) {
        console.error('Error loading user data:', e);
        userData = { balance: 0, completedTasks: {} };
      }

      const surveys = await fetchSurveys();
      renderSurveyList(surveys);
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        init();
      } else {
        window.location.href = 'login.html';
      }
    });

    window.logout = logout;
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registered:', reg))
      .catch(err => console.error('SW registration failed:', err));
  }
</script>
</body>
</html>
