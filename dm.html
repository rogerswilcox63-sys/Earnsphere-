<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>DM – EarnSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    .wrapper {
      width: 100%;
      max-width: 700px;
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
    }
    .navbar {
      background: rgba(30,41,59,.8);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .navbar .logo { font-size:1.4rem; font-weight:800; background:linear-gradient(135deg,#3b82f6,#10b981); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
    .navbar .logo i { margin-right:0.3rem; }
    .navbar .nav-right { display:flex; align-items:center; gap:0.8rem; }
    .navbar .logout-btn { background:rgba(59,130,246,.2); border:1px solid rgba(59,130,246,.3); padding:0.35rem 0.9rem; border-radius:2rem; color:#3b82f6; cursor:pointer; font-size:0.8rem; }
    .navbar .logout-btn:hover { background:rgba(59,130,246,.3); }
    .navbar .back-link { color:#94a3b8; text-decoration:none; font-size:0.85rem; display:flex; align-items:center; gap:0.4rem; }
    .navbar .back-link:hover { color:#f1f5f9; }

    .ad-container {
      max-width: 728px;
      margin: 12px auto;
      padding: 12px;
      background: rgba(30, 41, 59, 0.4);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(30,41,59,0.3);
      border-radius: 1rem;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .chat-header {
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-weight: 600;
    }
    .chat-header .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
    }
    .chat-header .avatar.admin { background: linear-gradient(135deg, #fbbf24, #f59e0b); color:#000; }
    .chat-messages {
      flex: 1;
      padding: 1rem 1.2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 300px;
      max-height: 500px;
    }
    .chat-messages .msg {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 0.9rem;
    }
    .chat-messages .msg.sent {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-messages .msg.received {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .chat-messages .msg .time {
      font-size: 0.6rem;
      opacity: 0.6;
      display: block;
      margin-top: 0.2rem;
      text-align: right;
    }
    .chat-input {
      display: flex;
      gap: 0.5rem;
      padding: 0.8rem 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(15,23,42,0.3);
    }
    .chat-input input {
      flex: 1;
      padding: 0.6rem 1rem;
      background: rgba(15,23,42,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      color: #f1f5f9;
      font-size: 0.9rem;
      outline: none;
    }
    .chat-input input:focus { border-color: #3b82f6; }
    .chat-input button {
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }
    .chat-input button:hover { transform: scale(1.05); }
    .loading { display:flex; justify-content:center; align-items:center; padding:1rem; color:#64748b; }
    .loading i { animation:spin 1s linear infinite; margin-right:0.5rem; }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      z-index: 9999;
      max-width: 90%;
      font-weight: 500;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
    .toast.success { border-left:4px solid #22c55e; }
    .toast.error { border-left:4px solid #ef4444; }
    .toast.info { border-left:4px solid #3b82f6; }
  </style>
</head>
<body>
<div class="wrapper">
  <nav class="navbar">
    <a href="dashboard.html" class="logo"><i class="fas fa-coins"></i> EarnSphere</a>
    <div class="nav-right">
      <a href="chat.html" class="back-link"><i class="fas fa-arrow-left"></i> <span>Back</span></a>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <!-- AD 1 -->
  <div class="ad-container">
    <script async src="https://ss.mrmnd.com/banner.js"></script>
    <div data-mndbanid="ee223c23-4173-4698-8e9c-26d4f3650c42"></div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="chatHeader">
      <div class="avatar" id="chatAvatar">U</div>
      <span class="name" id="chatName">Friend</span>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div style="text-align:center; padding:2rem; color:#64748b;">
        <i class="fas fa-spinner fa-spin" style="font-size:1.5rem;"></i>
        <p style="margin-top:0.5rem;">Loading messages...</p>
      </div>
    </div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- AD 2 -->
  <div class="ad-container">
    <script async src="https://ss.mrmnd.com/banner.js"></script>
    <div data-mndbanid="ee223c23-4173-4698-8e9c-26d4f3650c42"></div>
  </div>
</div>

<!-- ===== MONDIAD ADS ===== -->
<script async src="https://ss.mrmnd.com/popunder.js" data-mndpopid="a8aff8ff-2bef-4fee-baed-136632057710"></script>
<script async src="https://ss.mrmnd.com/static/50a5a986-052e-4ac4-acea-2d9bc37b53f3.js"></script>
<script async src="https://ss.mrmnd.com/native.js"></script>
<div data-mndazid="3e2075d4-e0ca-4589-b3a6-57960eb2fcd0"></div>
<script async src="https://ss.mrmnd.com/dynamic.js" data-mnddynid="a26ab055-a0eb-469b-98b1-ce863bec9ba7"></script>
<script async src="https://ss.mrmnd.com/interstitial.js" data-mndintid="c60da3d3-0ed9-41fc-bf0d-23b11a6002f0"></script>

<div id="toast" class="toast"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
    authDomain: "earnspherehub-742e9.firebaseapp.com",
    projectId: "earnspherehub-742e9",
    storageBucket: "earnspherehub-742e9.firebasestorage.app",
    messagingSenderId: "173538573377",
    appId: "1:173538573377:web:6d8c748376afcb9096dac0"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let currentFriendId = null;
  let chatUnsubscribe = null;

  function showToast(msg, type='success') {
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.className='toast '+type;
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide=setTimeout(()=>t.classList.remove('show'),4000);
  }

  function logout() {
    if(chatUnsubscribe) chatUnsubscribe();
    auth.signOut().then(()=>{ window.location.href='login.html'; });
  }

  // ============================================================
  // GENERATE CHAT ID
  // ============================================================
  function getChatId(uid1, uid2) {
    return [uid1, uid2].sort().join('_');
  }

  // ============================================================
  // LOAD MESSAGES
  // ============================================================
  function loadMessages() {
    if (!currentUser || !currentFriendId) return;

    const chatId = getChatId(currentUser.uid, currentFriendId);
    console.log('📨 Loading messages for chatId:', chatId);

    const messagesDiv = document.getElementById('chatMessages');

    if (chatUnsubscribe) chatUnsubscribe();

    chatUnsubscribe = db.collection('messages')
      .where('chatId', '==', chatId)
      .orderBy('timestamp', 'asc')
      .onSnapshot((snapshot) => {
        const container = messagesDiv;
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = `
            <div style="text-align:center; padding:2rem; color:#64748b;">
              <i class="fas fa-comment-dots" style="font-size:2rem; display:block; margin-bottom:0.5rem; color:#334155;"></i>
              <p>No messages yet. Say hello! 👋</p>
            </div>
          `;
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const isSent = data.senderId === currentUser.uid;
          const timeStr = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          container.innerHTML += `
            <div class="msg ${isSent ? 'sent' : 'received'}">
              ${data.message}
              <span class="time">${timeStr}</span>
            </div>
          `;
        });

        // Scroll to bottom
        container.scrollTop = container.scrollHeight;

        // Mark messages as read
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.receiverId === currentUser.uid && !data.read) {
            db.collection('messages').doc(doc.id).update({ read: true });
          }
        });
      }, (error) => {
        console.error('❌ Snapshot error:', error);
        messagesDiv.innerHTML = `
          <div style="text-align:center; padding:2rem; color:#ef4444;">
            <i class="fas fa-exclamation-circle" style="font-size:2rem; display:block; margin-bottom:0.5rem;"></i>
            <p>Error loading messages: ${error.message}</p>
          </div>
        `;
        showToast('❌ Error loading messages.', 'error');
      });
  }

  // ============================================================
  // SEND MESSAGE
  // ============================================================
  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) {
      showToast('Please type a message.', 'info');
      return;
    }
    if (!currentFriendId) {
      showToast('No friend selected.', 'error');
      return;
    }
    if (!currentUser) {
      showToast('Please log in.', 'error');
      return;
    }

    const chatId = getChatId(currentUser.uid, currentFriendId);
    console.log('📤 Sending to chatId:', chatId, 'Message:', text);

    try {
      await db.collection('messages').add({
        chatId: chatId,
        senderId: currentUser.uid,
        receiverId: currentFriendId,
        message: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false
      });
      input.value = '';
    } catch (e) {
      console.error('❌ Send error:', e);
      showToast('❌ Error sending: ' + e.message, 'error');
    }
  }

  // ============================================================
  // INIT CHAT
  // ============================================================
  async function initChat() {
    const params = new URLSearchParams(window.location.search);
    const friendUid = params.get('uid');

    if (!friendUid) {
      document.getElementById('chatMessages').innerHTML = `
        <div style="text-align:center; padding:2rem; color:#ef4444;">
          <i class="fas fa-exclamation-circle" style="font-size:2rem; display:block; margin-bottom:0.5rem;"></i>
          <p>No friend specified.</p>
        </div>
      `;
      return;
    }

    currentFriendId = friendUid;
    console.log('👤 Friend UID:', friendUid);

    // Load friend info
    try {
      const doc = await db.collection('users').doc(friendUid).get();
      if (!doc.exists) {
        document.getElementById('chatMessages').innerHTML = `
          <div style="text-align:center; padding:2rem; color:#ef4444;">
            <i class="fas fa-user-slash" style="font-size:2rem; display:block; margin-bottom:0.5rem;"></i>
            <p>Friend not found.</p>
          </div>
        `;
        return;
      }
      const data = doc.data();
      const isAdmin = data.isAdmin === true;
      const avatarChar = (data.displayName || 'U').charAt(0).toUpperCase();
      document.getElementById('chatAvatar').textContent = avatarChar;
      document.getElementById('chatAvatar').className = isAdmin ? 'avatar admin' : 'avatar';
      document.getElementById('chatName').textContent = data.displayName || 'Unknown';
    } catch (e) {
      console.error('Error loading friend:', e);
      showToast('Error loading friend info.', 'error');
    }

    // Load messages
    loadMessages();
  }

  // ============================================================
  // ENTER KEY
  // ============================================================
  document.getElementById('messageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // ============================================================
  // AUTH
  // ============================================================
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      console.log('✅ Logged in as:', user.uid);
      await initChat();
    } else {
      window.location.href = 'login.html';
    }
  });

  // Expose functions globally
  window.sendMessage = sendMessage;
  window.logout = logout;
</script>

</body>
</html>
