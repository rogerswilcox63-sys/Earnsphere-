<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Achievements – EarnSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 2rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(59,130,246,.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(16,185,129,.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .wrapper {
      width: 100%;
      max-width: 1000px;
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(30,41,59,.8);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,.08);
    }
    .navbar .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }
    .navbar .logo i { margin-right: 0.3rem; }
    .navbar .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.3s;
    }
    .navbar .back-link:hover { color: #f1f5f9; }

    .page-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .page-header h1 {
      font-size: 2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .page-header h1 i { color: #fbbf24; }
    .page-header p { color: #94a3b8; font-size: 0.95rem; margin-top: 0.2rem; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .summary-card {
      background: rgba(30,41,59,.5);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
      border: 1px solid rgba(255,255,255,.06);
    }
    .summary-card .value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #10b981;
    }
    .summary-card .label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0.2rem;
    }

    /* NEW BADGE COLLECTION */
    .badge-section {
      background: rgba(30,41,59,.5);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(255,255,255,.06);
    }
    .badge-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 1rem;
      justify-content: center;
    }
    .badge-item {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #334155, #1e293b);
      border: 2px solid rgba(100,116,139,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #475569;
      position: relative;
      transition: all 0.3s ease;
    }
    .badge-item.unlocked {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-color: #fbbf24;
      color: #0f172a;
      box-shadow: 0 0 20px rgba(251,191,36,.4);
      transform: scale(1.05);
    }
    .badge-item .tooltip {
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #f1f5f9;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.65rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      border: 1px solid #334155;
    }
    .badge-item:hover .tooltip { opacity: 1; }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 2rem 0 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .section-title i { color: #3b82f6; }

    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
      gap: 1.2rem;
    }
    .achievement-card {
      background: rgba(30,41,59,.6);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 1.2rem 1.2rem 1rem;
      border: 1px solid rgba(255,255,255,.06);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .achievement-card.unlocked {
      border-color: rgba(16,185,129,.3);
      background: rgba(16,185,129,.05);
    }
    .achievement-card.locked {
      opacity: 0.6;
      filter: grayscale(0.4);
    }
    .achievement-card .icon {
      font-size: 2rem;
      margin-bottom: 0.3rem;
      color: #64748b;
    }
    .achievement-card.unlocked .icon { color: #fbbf24; }
    .achievement-card .title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.1rem;
    }
    .achievement-card .desc {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.6rem;
      flex: 1;
    }
    .achievement-card .reward {
      font-size: 0.8rem;
      color: #10b981;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .achievement-card .progress-area {
      margin-top: 0.3rem;
    }
    .achievement-card .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .achievement-card .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 4px;
      width: 0%;
      transition: width 0.5s ease;
    }
    .achievement-card .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
    .achievement-card .status-badge {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      background: rgba(100,116,139,.2);
      color: #94a3b8;
      text-transform: uppercase;
    }
    .achievement-card.unlocked .status-badge {
      background: rgba(16,185,129,.2);
      color: #10b981;
    }
    .claim-btn {
      padding: 0.4rem 0.8rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 0.4rem;
      align-self: flex-start;
    }
    .claim-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 4px 20px rgba(245,158,11,.3); }
    .claim-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .claim-btn.claimed { background: #334155; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      z-index: 9999;
      max-width: 90%;
      font-weight: 500;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast.success { border-left: 4px solid #22c55e; }
    .toast.error { border-left: 4px solid #ef4444; }

    @media (max-width: 640px) {
      .navbar { padding: 0.6rem 1rem; }
      .page-header h1 { font-size: 1.5rem; }
      .summary-grid { grid-template-columns: repeat(2,1fr); }
      .achievement-grid { grid-template-columns: 1fr; }
      .badge-item { width: 60px; height: 60px; font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <nav class="navbar">
    <a href="dashboard.html" class="logo"><i class="fas fa-coins"></i> EarnSphere</a>
    <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
  </nav>

  <div class="page-header">
    <h1><i class="fas fa-trophy"></i> Achievements</h1>
    <p>Complete tasks and earn rewards – claim each achievement once!</p>
  </div>

  <div class="summary-grid" id="summaryGrid">
    <div class="summary-card"><div class="value" id="totalTasks">0</div><div class="label">Tasks Completed</div></div>
    <div class="summary-card"><div class="value" id="totalEarned">₦0</div><div class="label">Total Earned</div></div>
    <div class="summary-card"><div class="value" id="unlockedCount">0</div><div class="label">Badges Earned</div></div>
  </div>

  <!-- NEW BADGE COLLECTION SECTION -->
  <div class="badge-section">
    <div class="section-title"><i class="fas fa-award"></i> Your Badge Collection</div>
    <div class="badge-grid" id="badgeGrid"></div>
  </div>

  <div class="section-title"><i class="fas fa-list-check"></i> Task Master</div>
  <div class="achievement-grid" id="taskAchievements"></div>

  <div class="section-title"><i class="fas fa-coins"></i> Wealth Builder</div>
  <div class="achievement-grid" id="wealthAchievements"></div>

  <!-- ===== HIGHEST-PAYING AD: MONDIAD POP-UNDER ===== -->
  <script async src="https://ss.mrmnd.com/popunder.js" data-mndpopid="a8aff8ff-2bef-4fee-baed-136632057710"></script>

  <!-- ===== ADCASH ADS ===== -->
  <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
  <script type="text/javascript"> aclib.runPop({ zoneId: '11871326' }); </script>
</div>

<div id="toast" class="toast"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
    authDomain: "earnspherehub-742e9.firebaseapp.com",
    projectId: "earnspherehub-742e9",
    storageBucket: "earnspherehub-742e9.firebasestorage.app",
    messagingSenderId: "173538573377",
    appId: "1:173538573377:web:6d8c748376afcb9096dac0"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const taskAchievements = [
    { id: 'task_1',  icon: 'fa-star', badge: '🥉', title: 'First Task',      desc: 'Complete your first task',         threshold: 1,  reward: 50,  color: '#f59e0b' },
    { id: 'task_5',  icon: 'fa-star-half-alt', badge: '🥈', title: 'Task Enthusiast', desc: 'Complete 5 tasks',            threshold: 5,  reward: 100, color: '#f59e0b' },
    { id: 'task_10', icon: 'fa-star', badge: '🏅', title: 'Task Hero',        desc: 'Complete 10 tasks',           threshold: 10, reward: 150, color: '#f59e0b' },
    { id: 'task_25', icon: 'fa-medal', badge: '🎖️', title: 'Task Master',      desc: 'Complete 25 tasks',           threshold: 25, reward: 250, color: '#3b82f6' },
    { id: 'task_50', icon: 'fa-trophy', badge: '🏆', title: 'Task Legend',     desc: 'Complete 50 tasks',           threshold: 50, reward: 500, color: '#10b981' },
    { id: 'task_100', icon: 'fa-crown', badge: '👑', title: 'Task God',        desc: 'Complete 100 tasks',          threshold: 100, reward: 1000, color: '#8b5cf6' }
  ];

  const wealthAchievements = [
    { id: 'wealth_500',   icon: 'fa-coins', badge: '💰', title: '₦500 Club',    desc: 'Earn ₦500 total',            threshold: 500,   reward: 50,   color: '#f59e0b' },
    { id: 'wealth_1000',  icon: 'fa-coins', badge: '💵', title: '₦1K Club',     desc: 'Earn ₦1,000 total',          threshold: 1000,  reward: 100,  color: '#f59e0b' },
    { id: 'wealth_5000',  icon: 'fa-money-bill', badge: '💸', title: '₦5K Club',     desc: 'Earn ₦5,000 total',          threshold: 5000,  reward: 200,  color: '#3b82f6' },
    { id: 'wealth_10000', icon: 'fa-money-bill-wave', badge: '🤑', title: '₦10K Club',    desc: 'Earn ₦10,000 total',         threshold: 10000, reward: 500,  color: '#10b981' },
    { id: 'wealth_50000', icon: 'fa-gem', badge: '💎', title: '₦50K Club',    desc: 'Earn ₦50,000 total',         threshold: 50000, reward: 1000, color: '#8b5cf6' },
    { id: 'wealth_100000', icon: 'fa-crown', badge: '👑', title: '₦100K Club',   desc: 'Earn ₦100,000 total',        threshold: 100000, reward: 2000, color: '#ef4444' }
  ];

  let currentUser = null;
  let userData = {};

  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type;
    void toast.offsetWidth;
    toast.classList.add('show');
    clearTimeout(toast._hide);
    toast._hide = setTimeout(() => toast.classList.remove('show'), 4000);
  }

  async function claimAchievement(achId) {
    if (!currentUser) { showToast('⚠️ Please log in.', 'error'); return; }
    const btn = document.querySelector(`.claim-btn[data-id="${achId}"]`);
    if (!btn) return;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try {
      const docRef = db.collection('users').doc(currentUser.uid);
      const doc = await docRef.get();
      if (!doc.exists) { showToast('⚠️ User not found.', 'error'); btn.disabled = false; btn.innerHTML = 'Claim'; return; }
      const data = doc.data();
      const claimed = data.claimedAchievements || [];
      if (claimed.includes(achId)) {
        showToast('⏳ Already claimed this reward.', 'warning');
        btn.innerHTML = '✅ Claimed';
        btn.disabled = true;
        btn.classList.add('claimed');
        return;
      }
      const allAchs = [...taskAchievements, ...wealthAchievements];
      const ach = allAchs.find(a => a.id === achId);
      if (!ach) { showToast('❌ Achievement not found.', 'error'); btn.disabled = false; btn.innerHTML = 'Claim'; return; }
      const tasksDone = data.successfulTaskCount || 0;
      const totalEarned = data.lifetimeTotal || 0;
      let reached = false;
      if (taskAchievements.some(a => a.id === achId)) { reached = tasksDone >= ach.threshold; }
      else { reached = totalEarned >= ach.threshold; }
      if (!reached) { showToast('⚠️ You haven\'t unlocked this achievement yet.', 'error'); btn.disabled = false; btn.innerHTML = 'Claim'; return; }
      const newBalance = (data.balance || 0) + ach.reward;
      const newLifetime = (data.lifetimeTotal || 0) + ach.reward;
      const newClaimed = [...claimed, achId];
      await docRef.update({ balance: newBalance, lifetimeTotal: newLifetime, claimedAchievements: newClaimed });
      showToast(`🎉 Claimed ₦${ach.reward} + Badge ${ach.badge} for ${ach.title}!`, 'success');
      btn.innerHTML = '✅ Claimed';
      btn.disabled = true;
      btn.classList.add('claimed');
      const refreshed = await docRef.get();
      if (refreshed.exists) { userData = refreshed.data(); renderAchievements(userData); }
    } catch (err) { console.error(err); showToast('❌ Error claiming reward.', 'error'); btn.disabled = false; btn.innerHTML = 'Claim'; }
  }

  function renderBadgeCollection(claimed) {
    const badgeGrid = document.getElementById('badgeGrid');
    badgeGrid.innerHTML = '';
    const allAchs = [...taskAchievements, ...wealthAchievements];
    allAchs.forEach(ach => {
      const isUnlocked = claimed.includes(ach.id);
      badgeGrid.innerHTML += `
        <div class="badge-item ${isUnlocked ? 'unlocked' : ''}">
          ${ach.badge}
          <div class="tooltip">${ach.title}</div>
        </div>
      `;
    });
  }

  function renderAchievements(data) {
    const tasksDone = data.successfulTaskCount || 0;
    const totalEarned = data.lifetimeTotal || 0;
    const claimed = data.claimedAchievements || [];
    document.getElementById('totalTasks').textContent = tasksDone;
    document.getElementById('totalEarned').textContent = `₦${totalEarned.toLocaleString()}`;
    let unlockedCount = 0;
    
    renderBadgeCollection(claimed);

    const taskContainer = document.getElementById('taskAchievements');
    taskContainer.innerHTML = '';
    taskAchievements.forEach(ach => {
      const unlocked = tasksDone >= ach.threshold;
      if (unlocked) unlockedCount++;
      const progress = Math.min(tasksDone / ach.threshold, 1);
      const pct = Math.round(progress * 100);
      const isClaimed = claimed.includes(ach.id);
      taskContainer.innerHTML += createCard(ach, unlocked, pct, tasksDone, 'tasks', isClaimed);
    });
    const wealthContainer = document.getElementById('wealthAchievements');
    wealthContainer.innerHTML = '';
    wealthAchievements.forEach(ach => {
      const unlocked = totalEarned >= ach.threshold;
      if (unlocked) unlockedCount++;
      const progress = Math.min(totalEarned / ach.threshold, 1);
      const pct = Math.round(progress * 100);
      const isClaimed = claimed.includes(ach.id);
      wealthContainer.innerHTML += createCard(ach, unlocked, pct, totalEarned, '₦', isClaimed);
    });
    document.getElementById('unlockedCount').textContent = unlockedCount;
  }

  function createCard(ach, unlocked, pct, current, unit, isClaimed) {
    const displayValue = unit === '₦' ? `₦${current.toLocaleString()}` : `${current}`;
    const thresholdValue = unit === '₦' ? `₦${ach.threshold.toLocaleString()}` : `${ach.threshold}`;
    const statusText = unlocked ? 'Unlocked' : 'Locked';
    const statusClass = unlocked ? 'unlocked' : 'locked';
    let claimButton = '';
    if (unlocked && !isClaimed) { claimButton = `<button class="claim-btn" data-id="${ach.id}" onclick="claimAchievement('${ach.id}')">Claim ₦${ach.reward}</button>`; }
    else if (unlocked && isClaimed) { claimButton = `<button class="claim-btn claimed" disabled>✅ Claimed ${ach.badge}</button>`; }
    else { claimButton = `<button class="claim-btn" disabled style="background:#334155;">Locked</button>`; }
    return `
      <div class="achievement-card ${statusClass}">
        <div class="status-badge">${statusText}</div>
        <div class="icon">${ach.badge} <i class="fas ${ach.icon}"></i></div>
        <div class="title">${ach.title}</div>
        <div class="desc">${ach.desc}</div>
        <div class="reward">🎁 Reward: ₦${ach.reward} + Badge</div>
        <div class="progress-area">
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
          <div class="progress-label"><span>${displayValue}</span><span>${unlocked ? '✅' : 'Goal: '+thresholdValue}</span></div>
        </div>
        ${claimButton}
      </div>
    `;
  }

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) { userData = doc.data(); renderAchievements(userData); }
        else { userData = { successfulTaskCount: 0, lifetimeTotal: 0, claimedAchievements: [] }; renderAchievements(userData); }
      } catch (e) { console.error(e); userData = { successfulTaskCount: 0, lifetimeTotal: 0, claimedAchievements: [] }; renderAchievements(userData); }
    } else { window.location.href = 'login.html'; }
  });

  window.claimAchievement = claimAchievement;
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registered:', reg))
      .catch(err => console.error('SW registration failed:', err));
  }
</script>
</body>
</html>
