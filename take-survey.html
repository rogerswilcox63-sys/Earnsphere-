<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Take Survey – EarnSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    /* ===== GLOBAL ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height:100vh;
      color:#f1f5f9;
      display:flex;
      flex-direction:column;
    }
    body::before {
      content:'';
      position:fixed;
      inset:0;
      background: radial-gradient(circle at 20% 50%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(16,185,129,.1) 0%, transparent 50%);
      pointer-events:none;
      z-index:0;
    }
    #app {
      position:relative;
      z-index:1;
      max-width:800px;
      margin:2rem auto;
      padding:0 1.5rem;
      width:100%;
      flex:1;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(30,41,59,.8);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.5rem;
      border-radius: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255,255,255,.08);
    }
    .navbar .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }
    .navbar .logo i { margin-right: 0.3rem; }
    .navbar .nav-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .navbar .logout-btn {
      background: rgba(59,130,246,.2);
      border: 1px solid rgba(59,130,246,.3);
      padding: 0.35rem 0.9rem;
      border-radius: 2rem;
      font-weight: 500;
      color: #3b82f6;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s;
    }
    .navbar .logout-btn:hover { background: rgba(59,130,246,.3); }
    #userName {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-right: 0.5rem;
    }

    /* ===== SURVEY CARD ===== */
    .survey-card {
      background: rgba(30,41,59,.7);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      padding: 2rem;
      border: 1px solid rgba(255,255,255,.08);
    }
    .survey-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.3rem;
    }
    .survey-desc {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .survey-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .survey-meta .badge {
      background: rgba(16,185,129,.15);
      color: #10b981;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .survey-meta .reward {
      color: #10b981;
      font-weight: 700;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
      margin-bottom: 2rem;
    }
    .question-block .q-label {
      font-weight: 600;
      font-size: 1rem;
      color: #e2e8f0;
      display: block;
      margin-bottom: 0.4rem;
    }
    .question-block .q-label .required-star {
      color: #ef4444;
      margin-left: 0.2rem;
    }
    .question-block .q-help {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .form-control {
      width: 100%;
      padding: 0.7rem 1rem;
      background: rgba(15,23,42,.6);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 0.75rem;
      color: #f1f5f9;
      font-size: 1rem;
      font-family: inherit;
      transition: border 0.3s;
    }
    .form-control:focus {
      outline: none;
      border-color: #3b82f6;
    }
    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }
    select.form-control {
      appearance: auto;
    }
    .radio-group,
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 0.2rem 0;
    }
    .radio-group label,
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #cbd5e1;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .radio-group input[type="radio"],
    .checkbox-group input[type="checkbox"] {
      accent-color: #3b82f6;
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .rating-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .rating-group .rating-btn {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 0.5rem;
      padding: 0.4rem 0.8rem;
      color: #94a3b8;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      min-width: 40px;
      text-align: center;
    }
    .rating-group .rating-btn:hover,
    .rating-group .rating-btn.active {
      background: rgba(59,130,246,.2);
      border-color: #3b82f6;
      color: #f1f5f9;
    }

    /* ===== SUBMIT ===== */
    .submit-area {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(59,130,246,.3);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: rgba(255,255,255,.05);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,.08);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,.1);
      color: #f1f5f9;
    }

    /* ===== LOADING / ERROR ===== */
    .loading-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #94a3b8;
    }
    .loading-state i {
      font-size: 2.5rem;
      color: #3b82f6;
      display: block;
      margin-bottom: 1rem;
    }
    .error-state {
      text-align: center;
      padding: 2rem 1rem;
      color: #ef4444;
    }
    .error-state i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .completed-state {
      text-align: center;
      padding: 2rem 1rem;
      color: #10b981;
    }
    .completed-state i {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
    }

    /* ===== TOAST ===== */
    .toast {
      background: rgba(30,41,59,.95);
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(16,185,129,.3);
      color: #fff;
      animation: slideIn 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,.3);
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      max-width: 90%;
    }
    .toast.error {
      border-color: #ef4444;
    }
    @keyframes slideIn {
      from { transform:translateX(100%); opacity:0; }
      to { transform:translateX(0); opacity:1; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .navbar { flex-direction: column; text-align: center; }
      .survey-card { padding: 1.2rem; }
      .survey-title { font-size: 1.4rem; }
      .submit-area { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="dashboard.html" class="logo"><i class="fas fa-coins"></i> EarnSphere</a>
    <div class="nav-right">
      <span id="userName">Loading...</span>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <!-- SURVEY CONTENT -->
  <div id="surveyContainer">
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Loading survey...</p>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // FIREBASE CONFIG
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
    authDomain: "earnspherehub-742e9.firebaseapp.com",
    projectId: "earnspherehub-742e9",
    storageBucket: "earnspherehub-742e9.firebasestorage.app",
    messagingSenderId: "173538573377",
    appId: "1:173538573377:web:6d8c748376afcb9096dac0"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ============================================================
  // GLOBALS
  // ============================================================
  let currentUser = null;
  let userData = null;
  let surveyData = null;
  let surveyId = null;

  // ============================================================
  // HELPERS
  // ============================================================
  function showToast(msg, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  function getTodayDateString() {
    return new Date().toISOString().split('T')[0];
  }

  function logout() {
    auth.signOut().then(() => {
      localStorage.removeItem('earnsphere_user_data');
      window.location.href = 'login.html';
    });
  }

  function isTaskCompleted(taskId) {
    if (!userData || !userData.completedTasks || !userData.completedTasks[taskId]) return false;
    const completedDate = new Date(userData.completedTasks[taskId]).toISOString().split('T')[0];
    return completedDate === getTodayDateString();
  }

  function getSurveyCountToday() {
    let count = 0;
    if (userData && userData.completedTasks) {
      const today = getTodayDateString();
      for (const [taskId, timestamp] of Object.entries(userData.completedTasks)) {
        if (taskId.startsWith('srv_') || taskId.startsWith('survey_')) {
          const compDate = new Date(timestamp).toISOString().split('T')[0];
          if (compDate === today) count++;
        }
      }
    }
    return count;
  }

  // ============================================================
  // RENDER SURVEY
  // ============================================================
  function renderSurvey(survey) {
    const container = document.getElementById('surveyContainer');

    let questionsHtml = '';
    if (survey.questions && Array.isArray(survey.questions)) {
      survey.questions.forEach((q, idx) => {
        const isRequired = q.required === true;
        const qId = `q_${idx}`;
        let inputHtml = '';

        switch (q.type) {
          case 'text':
            inputHtml = `<input type="text" class="form-control" id="${qId}" placeholder="Your answer..." ${isRequired ? 'required' : ''} />`;
            break;
          case 'textarea':
            inputHtml = `<textarea class="form-control" id="${qId}" rows="3" placeholder="Your answer..." ${isRequired ? 'required' : ''}></textarea>`;
            break;
          case 'multiple':
            if (q.options && q.options.length) {
              inputHtml = `<div class="radio-group">`;
              q.options.forEach((opt) => {
                inputHtml += `
                  <label>
                    <input type="radio" name="${qId}" value="${opt.replace(/"/g, '&quot;')}" ${isRequired ? 'required' : ''} />
                    ${opt}
                  </label>
                `;
              });
              inputHtml += `</div>`;
            }
            break;
          case 'checkbox':
            if (q.options && q.options.length) {
              inputHtml = `<div class="checkbox-group">`;
              q.options.forEach((opt) => {
                inputHtml += `
                  <label>
                    <input type="checkbox" name="${qId}" value="${opt.replace(/"/g, '&quot;')}" />
                    ${opt}
                  </label>
                `;
              });
              inputHtml += `</div>`;
            }
            break;
          case 'dropdown':
            if (q.options && q.options.length) {
              inputHtml = `<select class="form-control" id="${qId}" ${isRequired ? 'required' : ''}>`;
              inputHtml += `<option value="">-- Select --</option>`;
              q.options.forEach(opt => {
                inputHtml += `<option value="${opt.replace(/"/g, '&quot;')}">${opt}</option>`;
              });
              inputHtml += `</select>`;
            }
            break;
          case 'rating':
            inputHtml = `<div class="rating-group" id="${qId}">`;
            for (let i = 1; i <= 5; i++) {
              inputHtml += `
                <button type="button" class="rating-btn" data-value="${i}" onclick="selectRating('${qId}', ${i})">${i}</button>
              `;
            }
            inputHtml += `</div><input type="hidden" id="${qId}" value="" ${isRequired ? 'required' : ''} />`;
            break;
          default:
            inputHtml = `<input type="text" class="form-control" id="${qId}" placeholder="Answer..." ${isRequired ? 'required' : ''} />`;
        }

        const questionText = q.text || `Question ${idx+1}`;
        questionsHtml += `
          <div class="question-block">
            <label class="q-label" for="${qId}">
              ${questionText}
              ${isRequired ? '<span class="required-star">*</span>' : ''}
            </label>
            ${q.type === 'rating' ? '<div class="q-help">Click a number to rate (1 = lowest, 5 = highest)</div>' : ''}
            ${inputHtml}
          </div>
        `;
      });
    } else {
      questionsHtml = `<p style="color:#94a3b8;">This survey has no questions.</p>`;
    }

    const reward = survey.reward || 0;
    const category = survey.category || 'General';

    container.innerHTML = `
      <div class="survey-card">
        <h1 class="survey-title">${survey.title || 'Untitled Survey'}</h1>
        <div class="survey-desc">${survey.description || 'No description provided.'}</div>
        <div class="survey-meta">
          <span class="badge">${category}</span>
          <span class="reward">💰 ₦${reward}</span>
          <span><i class="far fa-clock"></i> ~5 min</span>
          <span>${survey.questions ? survey.questions.length : 0} questions</span>
        </div>

        <form id="surveyForm" novalidate>
          ${questionsHtml}
          <div class="submit-area">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <i class="fas fa-check-circle"></i> Submit Survey
            </button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
              <i class="fas fa-times"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    `;

    document.getElementById('surveyForm').addEventListener('submit', handleSubmit);
  }

  // ============================================================
  // RATING SELECTION
  // ============================================================
  window.selectRating = function(qId, value) {
    const group = document.getElementById(qId);
    if (!group) return;
    const buttons = group.querySelectorAll('.rating-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    const selectedBtn = group.querySelector(`.rating-btn[data-value="${value}"]`);
    if (selectedBtn) selectedBtn.classList.add('active');
    const hiddenInput = document.getElementById(qId);
    if (hiddenInput) hiddenInput.value = value;
  };

  // ============================================================
  // HANDLE SUBMIT – FIXED VALIDATION
  // ============================================================
  async function handleSubmit(e) {
    e.preventDefault();

    const form = document.getElementById('surveyForm');
    const submitBtn = document.getElementById('submitBtn');

    // 1. Use browser's built-in validation (respects required attributes)
    if (!form.checkValidity()) {
      // Show a toast with a generic message and let the browser highlight the invalid fields
      showToast('⚠️ Please answer all required questions.', true);
      // Optionally, trigger the browser's native validation UI
      form.reportValidity();
      return;
    }

    // Disable submit button to prevent double-submission
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

    // Collect answers
    const formData = new FormData(form);
    const answerObj = {};
    for (let [key, value] of formData.entries()) {
      if (key.startsWith('q_')) {
        if (answerObj[key]) {
          if (Array.isArray(answerObj[key])) answerObj[key].push(value);
          else answerObj[key] = [answerObj[key], value];
        } else {
          answerObj[key] = value;
        }
      }
    }

    try {
      // 1. Save the response
      await db.collection('survey_responses').add({
        surveyId: surveyId,
        userId: currentUser.uid,
        answers: answerObj,
        submittedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // 2. Mark survey as completed and add reward
      const surveyDoc = await db.collection('surveys').doc(surveyId).get();
      const reward = surveyDoc.exists ? surveyDoc.data().reward || 0 : 0;

      if (!userData.completedTasks) userData.completedTasks = {};
      userData.completedTasks[surveyId] = Date.now();
      userData.balance = (userData.balance || 0) + reward;
      userData.lifetimeTotal = (userData.lifetimeTotal || 0) + reward;
      userData.successfulTaskCount = (userData.successfulTaskCount || 0) + 1;

      await db.collection('users').doc(currentUser.uid).set(userData, { merge: true });
      localStorage.setItem('earnsphere_user_data', JSON.stringify(userData));

      showToast(`🎉 Survey submitted! +₦${reward} added to your balance.`);
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    } catch (err) {
      console.error(err);
      showToast('❌ Error submitting survey. Please try again.', true);
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Submit Survey';
    }
  }

  // ============================================================
  // LOAD SURVEY
  // ============================================================
  async function loadSurvey(id) {
    try {
      const doc = await db.collection('surveys').doc(id).get();
      if (!doc.exists) {
        document.getElementById('surveyContainer').innerHTML = `
          <div class="error-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Survey not found.</p>
            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" style="margin-top:1rem;">
              <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button>
          </div>
        `;
        return;
      }
      surveyData = doc.data();
      surveyId = id;
      renderSurvey(surveyData);
    } catch (err) {
      console.error(err);
      document.getElementById('surveyContainer').innerHTML = `
        <div class="error-state">
          <i class="fas fa-exclamation-circle"></i>
          <p>Error loading survey. Please try again later.</p>
          <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" style="margin-top:1rem;">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
          </button>
        </div>
      `;
    }
  }

  // ============================================================
  // AUTH & INIT
  // ============================================================
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('userName').textContent = user.displayName || user.email || 'User';

      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          userData = doc.data();
        } else {
          userData = { balance: 0, completedTasks: {} };
        }
        console.log('👤 User data loaded:', userData);
      } catch (e) {
        console.error('Error loading user data:', e);
        userData = { balance: 0, completedTasks: {} };
      }

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || params.get('surveyId');
      console.log('📍 Full URL:', window.location.href);
      console.log('🆔 Extracted ID:', id);

      if (id) {
        if (userData.completedTasks && userData.completedTasks[id]) {
          document.getElementById('surveyContainer').innerHTML = `
            <div class="completed-state">
              <i class="fas fa-check-circle"></i>
              <h2>Already Completed</h2>
              <p style="color:#94a3b8;margin:0.5rem 0 1rem;">You have already completed this survey.</p>
              <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
              </button>
            </div>
          `;
          return;
        }

        const dailyCount = getSurveyCountToday();
        if (dailyCount >= 2) {
          document.getElementById('surveyContainer').innerHTML = `
            <div class="completed-state" style="color:#f59e0b;">
              <i class="fas fa-clock" style="color:#f59e0b;"></i>
              <h2>Daily Limit Reached</h2>
              <p style="color:#94a3b8;margin:0.5rem 0 1rem;">You have completed the maximum of 2 surveys today.</p>
              <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
              </button>
            </div>
          `;
          return;
        }

        loadSurvey(id);
      } else {
        document.getElementById('surveyContainer').innerHTML = `
          <div class="error-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>No survey ID provided.</p>
            <p style="font-size:0.85rem;color:#64748b;margin-top:0.5rem;">Please ensure the URL contains <code>?id=...</code></p>
            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" style="margin-top:1rem;">
              <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button>
          </div>
        `;
      }
    } else {
      window.location.href = 'login.html';
    }
  });

  // ============================================================
  // EXPOSE FUNCTIONS
  // ============================================================
  window.logout = logout;
  window.selectRating = selectRating;
