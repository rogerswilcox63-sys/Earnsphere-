<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>SphereAI - EarnSphere Nigeria</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); background-attachment: fixed; min-height:100vh; color:#f1f5f9; display:flex; flex-direction:column; }
    body::before { content:''; position:fixed; inset:0; background: radial-gradient(circle at 20% 50%, rgba(59,130,246,.08) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(16,185,129,.08) 0%, transparent 50%); pointer-events:none; z-index:0; }
    .navbar { background:rgba(30,41,59,.8); backdrop-filter:blur(12px); padding:0.7rem 1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.6rem; border-bottom:1px solid rgba(255,255,255,.08); position:relative; z-index:10; }
    .nav-links { display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center; }
    .nav-links a { text-decoration:none; color:#cbd5e1; font-weight:500; padding:0.35rem 0.8rem; border-radius:0.5rem; font-size:0.85rem; transition:all 0.3s; }
    .nav-links a:hover, .nav-links a.active { color:#3b82f6; background:rgba(59,130,246,.15); }
    .logo { font-size:1.3rem; font-weight:800; background:linear-gradient(135deg,#3b82f6,#10b981); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .logo i { margin-right:0.3rem; }
    .user-greeting { display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap; }
    .user-greeting span { font-size:0.85rem; color:#94a3b8; }
    .logout-btn { background:rgba(59,130,246,.2); border:1px solid rgba(59,130,246,.3); padding:0.35rem 0.9rem; border-radius:2rem; font-weight:500; color:#3b82f6; cursor:pointer; font-size:0.8rem; transition:all 0.3s; }
    .logout-btn:hover { background:rgba(59,130,246,.3); }
    .chat-container { flex:1; display:flex; flex-direction:column; max-width:1000px; margin:1rem auto; padding:0 1.2rem; width:100%; position:relative; z-index:1; height:calc(100vh - 80px); }
    .chat-header { display:flex; align-items:center; gap:0.8rem; padding-bottom:0.8rem; border-bottom:1px solid rgba(255,255,255,.06); flex-shrink:0; flex-wrap:wrap; }
    .chat-header .avatar { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#6d28d9); display:flex; align-items:center; justify-content:center; font-size:1.2rem; color:#fff; flex-shrink:0; }
    .chat-header .info h1 { font-size:1.1rem; font-weight:700; }
    .chat-header .info p { font-size:0.75rem; color:#94a3b8; }
    .chat-header .status { margin-left:auto; display:flex; align-items:center; gap:0.4rem; font-size:0.75rem; color:#10b981; }
    .chat-header .status .dot { width:7px; height:7px; border-radius:50%; background:#10b981; animation:pulse 1.5s infinite; }
    .chat-header .actions { display:flex; gap:0.4rem; }
    .chat-header .actions button { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:50%; width:34px; height:34px; color:#94a3b8; cursor:pointer; transition:all 0.2s; font-size:0.85rem; display:flex; align-items:center; justify-content:center; }
    .chat-header .actions button:hover { background:rgba(255,255,255,.12); color:#f1f5f9; }
    .chat-header .actions button.danger:hover { background:rgba(239,68,68,.2); color:#ef4444; }
    .chat-header .actions button.primary { background:rgba(16,185,129,.15); color:#10b981; }
    .chat-header .actions button.primary:hover { background:rgba(16,185,129,.25); }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

    .model-selector {
      margin-left: auto;
      margin-right: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .model-selector select {
      background: rgba(15,23,42,.6);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 0.5rem;
      padding: 0.2rem 0.4rem;
      color: #f1f5f9;
      font-size: 0.75rem;
      cursor: pointer;
      outline: none;
    }
    .model-selector select:focus { border-color: #3b82f6; }
    .model-selector select option { background: #1e293b; }

    .messages-wrapper { flex:1; overflow-y:auto; padding:0.8rem 0.3rem 0.3rem; display:flex; flex-direction:column; gap:0.6rem; scroll-behavior:smooth; }
    .messages-wrapper::-webkit-scrollbar { width:4px; }
    .messages-wrapper::-webkit-scrollbar-track { background:rgba(255,255,255,.02); border-radius:10px; }
    .messages-wrapper::-webkit-scrollbar-thumb { background:rgba(59,130,246,.3); border-radius:10px; }

    .msg { max-width:82%; padding:0.6rem 1rem; border-radius:14px; line-height:1.5; font-size:0.92rem; word-wrap:break-word; animation:fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .msg.user { align-self:flex-end; background:#3b82f6; color:#fff; border-bottom-right-radius:4px; }
    .msg.bot { align-self:flex-start; background:rgba(255,255,255,.08); color:#e2e8f0; border-bottom-left-radius:4px; }
    .msg .time { font-size:0.6rem; color:rgba(255,255,255,.4); display:block; margin-top:3px; }
    .msg.user .time { color:rgba(255,255,255,.5); }

    /* ===== THINKING SECTION ===== */
    .thinking-section {
      margin: 4px 0 6px 0;
      background: rgba(59,130,246,.08);
      border-left: 3px solid #3b82f6;
      border-radius: 0 6px 6px 0;
      padding: 6px 12px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .thinking-section .thinking-toggle {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #3b82f6;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 2px 0;
    }
    .thinking-section .thinking-toggle:hover { color: #60a5fa; }
    .thinking-section .thinking-content {
      display: none;
      padding-top: 6px;
      color: #cbd5e1;
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .thinking-section .thinking-content.open { display: block; }
    .thinking-section .thinking-content .think-label {
      color: #94a3b8;
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    /* ===== CODE BLOCKS ===== */
    .code-block-wrapper {
      margin: 8px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #0d1117;
      border: 1px solid rgba(255,255,255,.06);
      position: relative;
    }
    .code-block-wrapper .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .code-block-wrapper .code-header .lang {
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .code-block-wrapper .code-header .copy-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .code-block-wrapper .code-header .copy-btn:hover {
      background: rgba(255,255,255,.08);
      color: #f1f5f9;
    }
    .code-block-wrapper .code-header .copy-btn.copied {
      color: #10b981;
    }
    .code-block-wrapper pre {
      margin: 0 !important;
      padding: 12px 16px !important;
      background: #0d1117 !important;
      border-radius: 0 !important;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .code-block-wrapper pre code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #e2e8f0;
      background: transparent !important;
      padding: 0 !important;
    }

    .msg .attachments { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
    .msg .attachments .attach-item { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.2); padding:4px 10px 4px 6px; border-radius:8px; font-size:0.75rem; cursor:pointer; transition:background 0.2s; max-width:200px; }
    .msg .attachments .attach-item:hover { background:rgba(0,0,0,.35); }
    .msg .attachments .attach-item img { width:32px; height:32px; object-fit:cover; border-radius:4px; background:#1e293b; }
    .msg .attachments .attach-item i { font-size:1.2rem; color:#94a3b8; }
    .msg .attachments .attach-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .msg .attachments .attach-item .size { color:#94a3b8; font-size:0.65rem; }
    .msg .attachments .attach-item video { width:120px; height:80px; object-fit:cover; border-radius:4px; background:#0f172a; }
    .msg .generated-image { margin-top:8px; max-width:100%; border-radius:8px; border:1px solid rgba(255,255,255,.1); }
    .msg .generated-image img { width:100%; max-height:400px; object-fit:contain; border-radius:8px; background:#0f172a; }
    .msg .generated-video { margin-top:8px; max-width:100%; }
    .msg .generated-video video { width:100%; max-height:300px; border-radius:8px; border:1px solid rgba(255,255,255,.1); background:#0f172a; }
    .msg .download-link { display:inline-block; margin-top:4px; font-size:0.8rem; color:#3b82f6; text-decoration:none; }
    .msg .download-link:hover { text-decoration:underline; }
    .msg .prompt-label { font-size:0.75rem; color:#94a3b8; margin-top:4px; }

    .typing-indicator { align-self:flex-start; background:rgba(255,255,255,.06); padding:8px 14px; border-radius:14px; border-bottom-left-radius:4px; display:flex; align-items:center; gap:8px; color:#94a3b8; font-size:0.85rem; animation:fadeIn 0.3s ease; }
    .typing-indicator .dots { display:flex; gap:3px; }
    .typing-indicator .dots span { width:5px; height:5px; background:#94a3b8; border-radius:50%; animation:bounce 1.4s infinite; }
    .typing-indicator .dots span:nth-child(2){animation-delay:0.2s}
    .typing-indicator .dots span:nth-child(3){animation-delay:0.4s}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    .input-area { display:flex; flex-direction:column; gap:6px; padding:0.6rem 0 0.8rem; border-top:1px solid rgba(255,255,255,.06); flex-shrink:0; }
    .input-row { display:flex; align-items:flex-end; gap:8px; }
    .input-row textarea { flex:1; background:rgba(15,23,42,.6); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:0.6rem 0.9rem; color:#f1f5f9; font-size:0.92rem; font-family:'Inter',sans-serif; resize:none; min-height:40px; max-height:120px; outline:none; transition:border 0.2s; line-height:1.5; }
    .input-row textarea:focus { border-color:#3b82f6; }
    .input-row textarea::placeholder { color:#64748b; }
    .input-row .btn-icon { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:#94a3b8; cursor:pointer; transition:all 0.2s; font-size:0.95rem; flex-shrink:0; }
    .input-row .btn-icon:hover { background:rgba(255,255,255,.12); color:#f1f5f9; }
    .input-row .btn-icon.send { background:linear-gradient(135deg,#3b82f6,#2563eb); border:none; color:#fff; }
    .input-row .btn-icon.send:hover { transform:scale(1.05); box-shadow:0 4px 15px rgba(59,130,246,.3); }
    .input-row .btn-icon.send:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .input-row .btn-icon.image-btn { color:#10b981; }
    .input-row .btn-icon.image-btn:hover { background:rgba(16,185,129,.15); color:#10b981; }
    .input-row .btn-icon.video-btn { color:#f59e0b; }
    .input-row .btn-icon.video-btn:hover { background:rgba(245,158,11,.15); color:#f59e0b; }
    .attachment-preview { display:flex; flex-wrap:wrap; gap:6px; padding:4px 0 0; }
    .attachment-preview .file-chip { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.06); padding:3px 8px 3px 5px; border-radius:16px; font-size:0.75rem; border:1px solid rgba(255,255,255,.06); }
    .attachment-preview .file-chip img { width:24px; height:24px; object-fit:cover; border-radius:4px; }
    .attachment-preview .file-chip i { font-size:1rem; color:#94a3b8; }
    .attachment-preview .file-chip .remove { cursor:pointer; color:#ef4444; font-size:0.75rem; margin-left:2px; }
    .attachment-preview .file-chip .remove:hover { color:#f87171; }

    .history-sidebar { position:fixed; top:0; left:-380px; width:340px; height:100%; background:rgba(15,23,42,.95); backdrop-filter:blur(20px); border-right:1px solid rgba(255,255,255,.08); transition:left 0.3s ease; z-index:999; padding:1.5rem 1rem; overflow-y:auto; display:flex; flex-direction:column; }
    .history-sidebar.open { left:0; }
    .history-sidebar .sidebar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; padding-bottom:0.5rem; border-bottom:1px solid rgba(255,255,255,.06); }
    .history-sidebar .sidebar-header h3 { font-size:1.1rem; font-weight:700; }
    .history-sidebar .sidebar-header button { background:none; border:none; color:#94a3b8; font-size:1.2rem; cursor:pointer; }
    .history-sidebar .sidebar-header button:hover { color:#f1f5f9; }
    .history-sidebar .session-item { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:0.8rem 1rem; margin-bottom:0.6rem; cursor:pointer; transition:all 0.2s; }
    .history-sidebar .session-item:hover { background:rgba(255,255,255,.08); border-color:rgba(59,130,246,.3); }
    .history-sidebar .session-item .title { font-weight:600; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history-sidebar .session-item .date { font-size:0.7rem; color:#94a3b8; margin-top:2px; }
    .history-sidebar .session-item .preview { font-size:0.8rem; color:#94a3b8; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history-sidebar .session-item .delete-session { float:right; color:#64748b; background:none; border:none; cursor:pointer; font-size:0.8rem; }
    .history-sidebar .session-item .delete-session:hover { color:#ef4444; }
    .history-sidebar .empty-history { text-align:center; color:#94a3b8; padding:2rem 1rem; font-size:0.9rem; }
    .history-sidebar .clear-all { margin-top:auto; padding-top:1rem; border-top:1px solid rgba(255,255,255,.06); }
    .history-sidebar .clear-all button { width:100%; padding:0.6rem; background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.3); border-radius:8px; color:#ef4444; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .history-sidebar .clear-all button:hover { background:rgba(239,68,68,.25); }
    .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:998; display:none; }
    .sidebar-overlay.active { display:block; }
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#ef4444; color:#fff; padding:10px 20px; border-radius:8px; font-size:0.85rem; box-shadow:0 8px 30px rgba(0,0,0,.4); z-index:9999; opacity:0; transition:opacity 0.3s ease; pointer-events:none; max-width:90%; }
    .toast.show { opacity:1; pointer-events:auto; }
    .toast.success { background:#10b981; }

    @media (max-width:768px) {
      .navbar { padding:0.5rem 1rem; }
      .nav-links a { font-size:0.75rem; padding:0.25rem 0.6rem; }
      .logo { font-size:1.1rem; }
      .chat-container { padding:0 0.8rem; height:calc(100vh - 70px); }
      .msg { max-width:90%; font-size:0.85rem; padding:0.5rem 0.8rem; }
      .input-row textarea { font-size:0.85rem; padding:0.5rem 0.7rem; }
      .input-row .btn-icon { width:34px; height:34px; font-size:0.85rem; }
      .chat-header .info h1 { font-size:1rem; }
      .history-sidebar { width:280px; left:-320px; }
      .model-selector { font-size:0.7rem; }
      .model-selector select { font-size:0.7rem; padding:0.1rem 0.3rem; }
    }
    @media (max-width:480px) {
      .chat-header .info p { display:none; }
      .chat-header .status { font-size:0.65rem; }
      .msg .attachments .attach-item { max-width:140px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><i class="fas fa-coins"></i> EarnSphere</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="withdraw.html">Withdraw</a>
      <a href="profile.html">Profile</a>
      <a href="refer.html">Refer</a>
      <a href="community.html">Community</a>
      <a href="blog.html">Blog</a>
      <a href="ai-assistant.html" class="active"><i class="fas fa-robot"></i> AI Assistant</a>
    </div>
    <div class="user-greeting">
      <span id="userName">Welcome, User</span>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar"><i class="fas fa-brain"></i></div>
      <div class="info">
        <h1>SphereAI Assistant</h1>
        <p>Remembers your conversations</p>
      </div>
      <div class="status">
        <span class="dot"></span> Active
      </div>
      <div class="model-selector">
        <i class="fas fa-microchip" style="color:#3b82f6;"></i>
        <select id="modelSelector">
          <option value="openai/gpt-oss-20b">⚡ 20B (Fast)</option>
          <option value="openai/gpt-oss-120b" selected>🚀 120B (Best)</option>
          <option value="qwen/qwen3.6-27b">🧠 Qwen 3.6 27B</option>
        </select>
      </div>
      <div class="actions">
        <button class="primary" id="newChatBtn" title="New Chat"><i class="fas fa-plus"></i></button>
        <button id="historyBtn" title="Chat History"><i class="fas fa-clock-rotate-left"></i></button>
        <button class="danger" id="clearBtn" title="Clear current chat"><i class="fas fa-trash-alt"></i></button>
      </div>
    </div>

    <div class="messages-wrapper" id="messagesWrapper">
      <div id="loadingPlaceholder" style="text-align:center;color:#64748b;padding:2rem;font-size:0.9rem;">

    <div class="input-area">
      <div class="attachment-preview" id="attachmentPreview"></div>
      <div class="input-row">
        <button class="btn-icon image-btn" id="imageBtn" title="Attach image (AI can see it)"><i class="fas fa-image"></i></button>
        <button class="btn-icon video-btn" id="videoBtn" title="Attach video"><i class="fas fa-video"></i></button>
        <textarea id="messageInput" rows="1" placeholder="Type your message..."></textarea>
        <button class="btn-icon send" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="history-sidebar" id="historySidebar">
    <div class="sidebar-header">
      <h3><i class="fas fa-clock-rotate-left"></i> Chat History</h3>
      <button id="closeSidebar"><i class="fas fa-times"></i></button>
    </div>
    <div id="sessionList"><div class="empty-history">Loading sessions...</div></div>
    <div class="clear-all">
      <button id="clearAllHistory"><i class="fas fa-trash-alt"></i> Delete All History</button>
    </div>
  </div>

  <input type="file" id="imageInput" style="display:none" accept="image/*" />
  <input type="file" id="videoInput" style="display:none" accept="video/*" />
  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // FIREBASE
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
      authDomain: "earnspherehub-742e9.firebaseapp.com",
      projectId: "earnspherehub-742e9",
      storageBucket: "earnspherehub-742e9.firebasestorage.app",
      messagingSenderId: "173538573377",
      appId: "1:173538573377:web:6d8c748376afcb9096dac0"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // DOM REFS
    // ============================================================
    const messagesWrapper = document.getElementById('messagesWrapper');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const imageBtn = document.getElementById('imageBtn');
    const videoBtn = document.getElementById('videoBtn');
    const imageInput = document.getElementById('imageInput');
    const videoInput = document.getElementById('videoInput');
    const attachmentPreview = document.getElementById('attachmentPreview');
    const toast = document.getElementById('toast');

    let currentUser = null;

    let currentSessionId = null;
    let currentSessionMessages = [];

    const API_BASE_URL = 'https://earnsphere-ai.onrender.com';
    const COLLECTION_NAME = 'chat_history';
    const STORAGE_KEY = 'sphereai_selected_model';

    function loadSelectedModel() {

      if (saved && modelSelector.querySelector(`option[value="${saved}"]`)) {
        modelSelector.value = saved;
      } else {

    // ============================================================
    // HELPERS
    // ============================================================
    function showToast(msg, isError = true) {
      toast.textContent = msg;
      toast.className = 'toast' + (isError ? '' : ' success');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + 'B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(0) + 'KB';
      return (bytes / 1048576).toFixed(1) + 'MB';
    }

    function getFileIcon(mimeType) {
      if (mimeType && mimeType.startsWith('image/')) return 'fa-image';
      if (mimeType === 'application/pdf') return 'fa-file-pdf';
      if (mimeType && (mimeType.includes('word') || mimeType.includes('doc'))) return 'fa-file-word';
      if (mimeType && (mimeType.includes('excel') || mimeType.includes('sheet'))) return 'fa-file-excel';
      if (mimeType && (mimeType.includes('presentation') || mimeType.includes('ppt'))) return 'fa-file-powerpoint';
      if (mimeType && mimeType.startsWith('video/')) return 'fa-file-video';
      if (mimeType && mimeType.startsWith('text/')) return 'fa-file-alt';
      return 'fa-file';
    }

    function isImageType(mimeType) { return mimeType && mimeType.startsWith('image/'); }
    function isVideoType(mimeType) { return mimeType && mimeType.startsWith('video/'); }
    function getAttachmentType(mimeType) {
      if (isImageType(mimeType)) return 'image';
      if (isVideoType(mimeType)) return 'video';
      return 'file';
    }

    function getSessionTitle(messages) {
      if (!messages || messages.length === 0) return 'New Chat';
      const first = messages[0];
      const text = first.text || 'New Chat';
      return text.length > 30 ? text.substring(0, 30) + '…' : text;
    }

    // ============================================================
    // RENDER ATTACHMENT PREVIEW
    // ============================================================
    function renderAttachmentPreview() {
      if (attachments.length === 0) { attachmentPreview.innerHTML = ''; return; }
      attachmentPreview.innerHTML = attachments.map((att, idx) => {
        let previewHtml = '';
        if (att.type && att.type.startsWith('image/')) {
          previewHtml = `<img src="${att.dataURL}" alt="${att.name}" />`;
        } else if (att.type && att.type.startsWith('video/')) {
          previewHtml = `<i class="fas fa-file-video" style="font-size:1.2rem;color:#f59e0b;"></i>`;
        } else {
          const icon = getFileIcon(att.type);
          previewHtml = `<i class="fas ${icon}"></i>`;
        }
        return `
          <div class="file-chip">
            ${previewHtml}
            <span>${att.name}</span>
            <span class="remove" data-index="${idx}"><i class="fas fa-times"></i></span>
          </div>
        `;
      }).join('');
      attachmentPreview.querySelectorAll('.remove').forEach(el => {
        el.addEventListener('click', (e) => {
          const idx = parseInt(el.dataset.index);
          attachments.splice(idx, 1);
          renderAttachmentPreview();
        });
      });
    }

    // ============================================================
    // GENERATE AND SHOW MEDIA
    // ============================================================
    async function generateAndShowMedia(prompt, type, containerDiv) {
      try {
        const endpoint = type === 'image' 
          ? `${API_BASE_URL}/api/generate-image` 
          : `${API_BASE_URL}/api/generate-video`;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (!response.ok || !data.url) {
          containerDiv.textContent = `❌ Failed to generate ${type}. ${data.error || 'Please try again.'}`;
          return;
        }

        containerDiv.textContent = type === 'image' ? '🖼️ Image generated:' : '🎬 Video generated:';
        
        const mediaContainer = document.createElement('div');
        mediaContainer.className = 'generated-media';
        if (type === 'image') {
          const img = document.createElement('img');
          img.src = data.url;
          img.alt = prompt;
          img.style.maxWidth = '100%';
          img.style.borderRadius = '8px';
          mediaContainer.appendChild(img);
        } else {
          const video = document.createElement('video');
          video.src = data.url;
          video.controls = true;
          video.style.maxWidth = '100%';
          video.style.borderRadius = '8px';
          mediaContainer.appendChild(video);
        }

        const download = document.createElement('a');
        download.href = data.url;
        download.download = `generated-${type}.${type === 'image' ? 'png' : 'mp4'}`;
        download.className = 'download-link';
        download.textContent = `📥 Download ${type}`;
        mediaContainer.appendChild(download);

        const promptLabel = document.createElement('div');
        promptLabel.className = 'prompt-label';
        promptLabel.textContent = `📝 ${prompt}`;
        mediaContainer.appendChild(promptLabel);

        containerDiv.appendChild(mediaContainer);
      } catch (error) {
        containerDiv.textContent = `⚠️ Error generating ${type}: ${error.message}`;
      }
    }

    // ============================================================
    // PARSE THINKING AND CODE FROM AI RESPONSE
    // ============================================================
    function parseAIResponse(text) {
      let thinking = null;
      let content = text;

      // Extract [THINK: ...] content
      const thinkMatch = text.match(/\[THINK:\s*([\s\S]*?)\]/);
      if (thinkMatch) {
        thinking = thinkMatch[1].trim();
        content = text.replace(/\[THINK:\s*[\s\S]*?\]/, '').trim();
      }

      // If content is empty, use a placeholder
      if (!content) content = '✅ Done!';

      return { thinking, content };
    }

    // ============================================================
    // RENDER CODE BLOCKS WITH SYNTAX HIGHLIGHTING + COPY
    // ============================================================
    function renderCodeBlocks(text) {
      // Find all code blocks with language: ```language ... ```
      const codeBlockRegex = /```(\w+)?\s*([\s\S]*?)```/g;
      let match;
      let parts = [];
      let lastIndex = 0;

      while ((match = codeBlockRegex.exec(text)) !== null) {
        // Add text before the code block
        if (match.index > lastIndex) {
          parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
        }
        const lang = match[1] || 'plaintext';
        const code = match[2].trim();
        parts.push({ type: 'code', language: lang, content: code });
        lastIndex = match.index + match[0].length;
      }

      // Add remaining text
      if (lastIndex < text.length) {
        parts.push({ type: 'text', content: text.substring(lastIndex) });
      }

      return parts;
    }

    function createCodeBlockElement(language, code) {
      const wrapper = document.createElement('div');
      wrapper.className = 'code-block-wrapper';

      const header = document.createElement('div');
      header.className = 'code-header';
      const langSpan = document.createElement('span');
      langSpan.className = 'lang';
      langSpan.textContent = language || 'plaintext';
      header.appendChild(langSpan);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(code).then(() => {
          copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
            copyBtn.classList.remove('copied');
          }, 2000);
        }).catch(() => {
          // Fallback
          const textarea = document.createElement('textarea');
          textarea.value = code;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
          copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
          setTimeout(() => {
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
          }, 2000);
        });
      });
      header.appendChild(copyBtn);
      wrapper.appendChild(header);

      const pre = document.createElement('pre');
      const codeEl = document.createElement('code');
      codeEl.className = `language-${language}`;
      codeEl.textContent = code;
      pre.appendChild(codeEl);
      wrapper.appendChild(pre);

      // Apply highlight.js
      setTimeout(() => {
        if (window.hljs) {
          window.hljs.highlightElement(codeEl);
        }
      }, 10);

      return wrapper;
    }

    // ============================================================
    // ADD MESSAGE TO DOM (with thinking + code blocks)
    // ============================================================
    function addMessageToDOM(text, sender = 'user', attachmentsList = null, timestamp = null, generated = null) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;

      // For user messages, just show text
      if (sender === 'user') {
        const textNode = document.createTextNode(text);
        div.appendChild(textNode);
      } else {
        // For bot messages, parse thinking and code blocks
        // First check for generation tags
        const imageMatch = text.match(/\[IMAGE:\s*(.*?)\]/);
        const videoMatch = text.match(/\[VIDEO:\s*(.*?)\]/);

        let displayText = text;
        let generationPrompt = null;
        let generationType = null;

        if (imageMatch) {
          generationPrompt = imageMatch[1].trim();
          generationType = 'image';
          displayText = displayText.replace(/\[IMAGE:.*?\]/, '').trim();
          if (!displayText) displayText = '🖼️ Generating image...';
        } else if (videoMatch) {
          generationPrompt = videoMatch[1].trim();
          generationType = 'video';
          displayText = displayText.replace(/\[VIDEO:.*?\]/, '').trim();
          if (!displayText) displayText = '🎬 Generating video...';
        }

        // Parse thinking
        const { thinking, content } = parseAIResponse(displayText);

        // Add thinking section if present
        if (thinking) {
          const thinkDiv = document.createElement('div');
          thinkDiv.className = 'thinking-section';

          const toggle = document.createElement('div');
          toggle.className = 'thinking-toggle';
          toggle.innerHTML = '<i class="fas fa-brain"></i> Show thinking process';
          toggle.addEventListener('click', () => {
            const contentEl = toggle.nextElementSibling;
            if (contentEl) {
              contentEl.classList.toggle('open');
              toggle.innerHTML = contentEl.classList.contains('open') 
                ? '<i class="fas fa-brain"></i> Hide thinking process' 
                : '<i class="fas fa-brain"></i> Show thinking process';
            }
          });
          thinkDiv.appendChild(toggle);

          const contentDiv = document.createElement('div');
          contentDiv.className = 'thinking-content';
          const label = document.createElement('div');
          label.className = 'think-label';
          label.textContent = '🧠 Reasoning';
          contentDiv.appendChild(label);
          const textNode = document.createTextNode(thinking);
          contentDiv.appendChild(textNode);
          thinkDiv.appendChild(contentDiv);

          div.appendChild(thinkDiv);
        }

        // Render the main content with code blocks
        if (content) {
          const parts = renderCodeBlocks(content);
          const container = document.createElement('div');
          
          parts.forEach(part => {
            if (part.type === 'text') {
              if (part.content.trim()) {
                const textNode = document.createTextNode(part.content);
                container.appendChild(textNode);
              }
            } else if (part.type === 'code') {
              const codeBlock = createCodeBlockElement(part.language, part.content);
              container.appendChild(codeBlock);
            }
          });

          // If no parts, just add the text
          if (parts.length === 0 && content.trim()) {
            const textNode = document.createTextNode(content);
            container.appendChild(textNode);
          }

          div.appendChild(container);
        }

        // Handle image/video generation
        if (generationPrompt && (sender === 'bot' || sender === 'assistant')) {
          setTimeout(() => {
            generateAndShowMedia(generationPrompt, generationType, div);
          }, 100);
        }
      }

      // Handle attachments
      if (attachmentsList && attachmentsList.length > 0) {
        const attachContainer = document.createElement('div');
        attachContainer.className = 'attachments';
        attachmentsList.forEach(att => {
          const item = document.createElement('div');
          item.className = 'attach-item';
          const attType = getAttachmentType(att.type);
          if (attType === 'image') {
            const img = document.createElement('img');
            img.src = att.dataURL || att.url || '';
            img.alt = att.name;
            item.appendChild(img);
            item.addEventListener('click', () => window.open(img.src, '_blank'));
          } else if (attType === 'video') {
            const video = document.createElement('video');
            video.src = att.dataURL || att.url || '';
            video.controls = true;
            video.style.width = '120px';
            video.style.height = '80px';
            video.style.objectFit = 'cover';
            video.style.borderRadius = '4px';
            item.appendChild(video);
          } else {
            const icon = document.createElement('i');
            icon.className = `fas ${getFileIcon(att.type)}`;
            item.appendChild(icon);
          }
          const nameSpan = document.createElement('span');
          nameSpan.className = 'name';
          nameSpan.textContent = att.name;
          item.appendChild(nameSpan);
          const sizeSpan = document.createElement('span');
          sizeSpan.className = 'size';
          sizeSpan.textContent = formatFileSize(att.size || 0);
          item.appendChild(sizeSpan);
          item.addEventListener('click', () => {
            if (att.dataURL) {
              const a = document.createElement('a');
              a.href = att.dataURL;
              a.download = att.name;
              a.click();
            }
          });
          attachContainer.appendChild(item);
        });
        div.appendChild(attachContainer);
      }

      // Time
      const time = document.createElement('span');
      time.className = 'time';
      const ts = timestamp ? new Date(timestamp) : new Date();
      time.textContent = ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.appendChild(time);

      const placeholder = document.getElementById('loadingPlaceholder');
      if (placeholder) placeholder.remove();

      messagesWrapper.appendChild(div);
      messagesWrapper.scrollTop = messagesWrapper.scrollHeight;
    }

    // ============================================================
    // SESSION FUNCTIONS (Firestore)
    // ============================================================
    async function createNewSession() {
      if (!currentUser) return null;
      const newDoc = {
        userId: currentUser.uid,
        title: 'New Chat',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        messages: []
      };
      try {
        const docRef = await db.collection(COLLECTION_NAME).add(newDoc);
        return docRef.id;
      } catch (e) {
        console.error('Error creating session:', e);
        showToast('Could not create new chat session.');
        return null;
      }
    }

    async function saveMessageToSession(sessionId, role, text, attachmentsList = null, generated = null) {
      if (!sessionId || !currentUser) return;
      const msg = {
        role: role,
        text: text || '',
        attachments: attachmentsList || [],
        generated: generated || null,
        timestamp: Date.now()
      };
      try {
        const docRef = db.collection(COLLECTION_NAME).doc(sessionId);
        await docRef.update({
          messages: firebase.firestore.FieldValue.arrayUnion(msg),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {
        console.error('Error saving message:', e);
        showToast('Could not save message.');
      }
    }

    async function loadSession(sessionId) {
      if (!sessionId || !currentUser) return;
      try {
        const doc = await db.collection(COLLECTION_NAME).doc(sessionId).get();
        if (!doc.exists) {
          showToast('Session not found.');
          return;
        }
        const data = doc.data();
        if (data.userId !== currentUser.uid) {
          showToast('You do not have access to this session.');
          return;
        }
        messagesWrapper.innerHTML = '';
        const messages = data.messages || [];
        currentSessionMessages = messages;
        currentSessionId = sessionId;
        if (messages.length === 0) {
          const welcome = { role: 'bot', text: '👋 How you dey? I\'m SphereAI...', attachments: [], timestamp: Date.now() };
          currentSessionMessages.push(welcome);
          addMessageToDOM(welcome.text, 'bot', welcome.attachments, welcome.timestamp);
          await saveMessageToSession(sessionId, 'bot', welcome.text, []);
        } else {
          messages.forEach(msg => {
            try {
              const generated = msg.generated || null;
              addMessageToDOM(msg.text || '', msg.role || 'bot', msg.attachments || [], msg.timestamp || Date.now(), generated);
            } catch (e) {
              console.warn('Error parsing message:', e);
            }
          });
        }
      } catch (e) {
        console.error('Error loading session:', e);
        showToast('Could not load chat session.');
      }
    }

    async function deleteSession(sessionId) {
      if (!sessionId) return;
      if (!confirm('Delete this chat session?')) return;
      try {
        await db.collection(COLLECTION_NAME).doc(sessionId).delete();
        if (currentSessionId === sessionId) {
          await startNewChat();
        }
        await loadSessionList();
        showToast('Session deleted.', false);
      } catch (e) {
        console.error('Error deleting session:', e);
        showToast('Error deleting session.');
      }
    }

    async function clearAllHistory() {
      if (!currentUser) return;
      if (!confirm('Delete ALL chat history? This cannot be undone.')) return;
      try {
        const snapshot = await db.collection(COLLECTION_NAME)
          .where('userId', '==', currentUser.uid)
          .get();
        const batch = db.batch();
        snapshot.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        await startNewChat();
        await loadSessionList();
        showToast('All chat history cleared.', false);
      } catch (e) {
        console.error('Error clearing history:', e);
        showToast('Error clearing history.');
      }
    }

    async function loadSessionList() {
      if (!currentUser) return;
      try {
        const snapshot = await db.collection(COLLECTION_NAME)
          .where('userId', '==', currentUser.uid)
          .orderBy('updatedAt', 'desc')
          .get();
        if (snapshot.empty) {
          sessionList.innerHTML = `<div class="empty-history">No chat sessions yet. Start a new chat!</div>`;
          return;
        }
        let html = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const title = data.title || 'New Chat';
          let date = 'Just now';
          if (data.updatedAt) {
            try {
              const d = data.updatedAt.toDate ? data.updatedAt.toDate() : new Date(data.updatedAt);
              date = d.toLocaleString('en-NG', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch (e) { /* ignore */ }
          }
          const preview = data.messages && data.messages.length > 0 ?
            (data.messages[0].text || '') : '';
          html += `
            <div class="session-item" data-id="${doc.id}">
              <div class="title">${title}</div>
              <div class="date">${date}</div>
              <div class="preview">${preview.substring(0, 50)}${preview.length > 50 ? '…' : ''}</div>
              <button class="delete-session" data-id="${doc.id}"><i class="fas fa-trash-alt"></i></button>
            </div>
          `;
        });
        sessionList.innerHTML = html;

        sessionList.querySelectorAll('.session-item').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('.delete-session')) return;
            const id = el.dataset.id;
            closeSidebarPanel();
            loadSession(id);
          });
        });
        sessionList.querySelectorAll('.delete-session').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            deleteSession(id);
          });
        });
      } catch (e) {
        console.error('Error loading session list:', e);
        sessionList.innerHTML = `<div class="empty-history">Error loading sessions. Please refresh.</div>`;
      }
    }

    async function startNewChat() {
      messagesWrapper.innerHTML = '';
      currentSessionMessages = [];
      const newId = await createNewSession();
      if (newId) {
        currentSessionId = newId;
        const welcome = {
          role: 'bot',
          text: '👋 How you dey? I\'m SphereAI, your personal hustler assistant. Ask me anything about earning, tasks, or just talk! No wahala.',
          attachments: [],
          timestamp: Date.now()
        };
        currentSessionMessages.push(welcome);
        addMessageToDOM(welcome.text, 'bot', welcome.attachments, welcome.timestamp);
        await saveMessageToSession(newId, 'bot', welcome.text, []);
        await updateSessionTitle(newId, 'New Chat');
      } else {
        currentSessionId = 'local_' + Date.now();
        const welcome = {
          role: 'bot',
          text: '👋 How you dey? I\'m SphereAI, your personal hustler assistant. Ask me anything about earning, tasks, or just talk! No wahala.',
          attachments: [],
          timestamp: Date.now()
        };
        currentSessionMessages.push(welcome);
        addMessageToDOM(welcome.text, 'bot', welcome.attachments, welcome.timestamp);
        showToast('⚠️ Using local mode. Messages will not be saved to history.', false);
      }
      closeSidebarPanel();
    }

    async function updateSessionTitle(sessionId, title) {
      if (!sessionId || sessionId.startsWith('local_')) return;
      try {
        await db.collection(COLLECTION_NAME).doc(sessionId).update({ title });
      } catch (e) { /* ignore */ }
    }

    // ============================================================
    // SEND MESSAGE
    // ============================================================
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text && attachments.length === 0) {
        showToast('Please type a message or attach something.', false);
        return;
      }
      if (isSending) return;
      isSending = true;

      sendBtn.disabled = true;
      messageInput.disabled = true;

      if (!currentSessionId) {
        await startNewChat();
        if (!currentSessionId) {
          isSending = false;
          sendBtn.disabled = false;
          messageInput.disabled = false;
          return;
        }
      }

      const attachCopy = attachments.map(a => ({
        name: a.name,
        size: a.size,
        type: a.type,
        dataURL: a.dataURL || null
      }));

      const imageAttachment = attachments.find(a => a.type && a.type.startsWith('image/'));
      const imageData = imageAttachment ? imageAttachment.dataURL : null;

      const displayText = text || (attachments.length > 0 ? '📎 Attached file' : '');
      addMessageToDOM(displayText, 'user', attachCopy);
      currentSessionMessages.push({ role: 'user', text: displayText, attachments: attachCopy, timestamp: Date.now() });
      if (!currentSessionId.startsWith('local_')) {
        await saveMessageToSession(currentSessionId, 'user', displayText, attachCopy);
      }

      messageInput.value = '';
      messageInput.style.height = 'auto';
      attachments = [];
      renderAttachmentPreview();

      if (currentSessionMessages.length === 1 && !currentSessionId.startsWith('local_')) {
        const title = getSessionTitle(currentSessionMessages);
        await updateSessionTitle(currentSessionId, title);
        await loadSessionList();
      }

      showTyping();

      try {
        const history = currentSessionMessages.slice(-10).map(h => ({
          role: h.role,
          text: h.text || ''
        }));

        const selectedModel = modelSelector.value;

        const payload = {
          message: text || 'I sent an attachment.',
          history: history,
          image: imageData || null,
          model: selectedModel
        };

        const response = await fetch(`${API_BASE_URL}/api/grok`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        hideTyping();

        if (!response.ok) {
          const errMsg = data.error || `Server error (${response.status})`;
          const reply = `😅 Oops! My brain no dey work right now. ${errMsg} No wahala, I go soon reset.`;
          addMessageToDOM(reply, 'bot');
          currentSessionMessages.push({ role: 'bot', text: reply, attachments: [], timestamp: Date.now() });
          if (!currentSessionId.startsWith('local_')) {
            await saveMessageToSession(currentSessionId, 'bot', reply, []);
          }
          return;
        }

        const reply = data.reply || 'I no get response o, but I dey try!';
        addMessageToDOM(reply, 'bot');
        currentSessionMessages.push({ role: 'bot', text: reply, attachments: [], timestamp: Date.now() });
        if (!currentSessionId.startsWith('local_')) {
          await saveMessageToSession(currentSessionId, 'bot', reply, []);
        }

      } catch (error) {
        hideTyping();
        const reply = `😅 Oops! My brain no dey work right now. ${error.message || 'Try again later.'} No wahala, I go soon reset.`;
        addMessageToDOM(reply, 'bot');
        currentSessionMessages.push({ role: 'bot', text: reply, attachments: [], timestamp: Date.now() });
        if (!currentSessionId.startsWith('local_')) {
          await saveMessageToSession(currentSessionId, 'bot', reply, []);
        }
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    // ============================================================
    // CLEAR CURRENT CHAT
    // ============================================================
    async function clearCurrentChat() {
      if (!confirm('Clear this chat session?')) return;
      await startNewChat();
      if (!currentSessionId.startsWith('local_')) {
        await loadSessionList();
      }
    }

    // ============================================================
    // TYPING INDICATOR
    // ============================================================
    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing-indicator';
      div.id = 'typingIndicator';
      div.innerHTML = `
        SphereAI is thinking
        <span class="dots">
          <span></span><span></span><span></span>
        </span>
      `;
      messagesWrapper.appendChild(div);
      messagesWrapper.scrollTop = messagesWrapper.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // ============================================================
    // SIDEBAR
    // ============================================================
    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('active');
      loadSessionList();
    }

    function closeSidebarPanel() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    // ============================================================
    // HANDLE FILE ATTACHMENTS
    // ============================================================
    function handleFile(file, isImage = false, isVideo = false) {
      const allowedImageTypes = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/heic'];
      const allowedVideoTypes = ['video/mp4', 'video/webm', 'video/ogg', 'video/quicktime'];

      if (isImage && !allowedImageTypes.includes(file.type)) {
        showToast('⚠️ Please select a valid image (PNG, JPG, GIF, WEBP).');
        return false;
      }
      if (isVideo && !allowedVideoTypes.includes(file.type)) {
        showToast('⚠️ Please select a valid video (MP4, WEBM, OGG).');
        return false;
      }

      const maxSize = isVideo ? 10 * 1024 * 1024 : 5 * 1024 * 1024;
      if (file.size > maxSize) {
        showToast(`⚠️ File too large: ${file.name} (max ${maxSize/1048576}MB)`);
        return false;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const dataURL = e.target.result;
        attachments.push({
          name: file.name,
          size: file.size,
          type: file.type,
          dataURL: dataURL
        });
        renderAttachmentPreview();
      };
      reader.readAsDataURL(file);
      return true;
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    imageBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0], true, false);
      }
      imageInput.value = '';
    });

    videoBtn.addEventListener('click', () => videoInput.click());
    videoInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0], false, true);
      }
      videoInput.value = '';
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = messageInput.scrollHeight + 'px';
    });

    historyBtn.addEventListener('click', openSidebar);
    closeSidebar.addEventListener('click', closeSidebarPanel);
    overlay.addEventListener('click', closeSidebarPanel);
    newChatBtn.addEventListener('click', startNewChat);
    clearBtn.addEventListener('click', clearCurrentChat);
    clearAllHistoryBtn.addEventListener('click', clearAllHistory);

    const chatContainer = document.querySelector('.chat-container');
    chatContainer.addEventListener('dragover', (e) => {
      e.preventDefault();
      chatContainer.style.border = '2px dashed #3b82f6';
    });
    chatContainer.addEventListener('dragleave', (e) => {
      e.preventDefault();
      chatContainer.style.border = 'none';
    });
    chatContainer.addEventListener('drop', (e) => {
      e.preventDefault();
      chatContainer.style.border = 'none';
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.type && file.type.startsWith('image/')) {
          handleFile(file, true, false);
        } else if (file.type && file.type.startsWith('video/')) {
          handleFile(file, false, true);
        } else {
          showToast('⚠️ Only images and videos can be dropped.');
        }
      }
    });

    // ============================================================
    // LOGOUT
    // ============================================================
    function logout() {
      auth.signOut().then(() => {
        localStorage.removeItem('earnsphere_user_data');
        window.location.href = 'login.html';
      });
    }

    // ============================================================
    // AUTH
    // ============================================================
    loadSelectedModel();

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('userName').textContent = user.displayName || user.email || 'User';
        try {
          const snapshot = await db.collection(COLLECTION_NAME)
            .where('userId', '==', user.uid)
            .orderBy('updatedAt', 'desc')
            .limit(1)
            .get();
          if (!snapshot.empty) {
            const doc = snapshot.docs[0];
            await loadSession(doc.id);
          } else {
            await startNewChat();
          }
        } catch (e) {
          console.error('Error loading initial session:', e);
          await startNewChat();
        }
        await loadSessionList();
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
