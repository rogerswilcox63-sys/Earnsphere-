<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Chat – EarnSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    /* (styles are the same as before – I'll keep them minimal) */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }
    .wrapper {
      width: 100%;
      max-width: 700px;
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
    }
    .navbar {
      background: rgba(30,41,59,.8);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .navbar .logo { font-size:1.4rem; font-weight:800; background:linear-gradient(135deg,#3b82f6,#10b981); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
    .navbar .logo i { margin-right:0.3rem; }
    .navbar .nav-right { display:flex; align-items:center; gap:0.8rem; }
    .navbar .logout-btn { background:rgba(59,130,246,.2); border:1px solid rgba(59,130,246,.3); padding:0.35rem 0.9rem; border-radius:2rem; color:#3b82f6; cursor:pointer; font-size:0.8rem; }
    .navbar .logout-btn:hover { background:rgba(59,130,246,.3); }
    .navbar .back-link { color:#94a3b8; text-decoration:none; font-size:0.85rem; display:flex; align-items:center; gap:0.4rem; }
    .navbar .back-link:hover { color:#f1f5f9; }

    .friend-list-container {
      background: rgba(30,41,59,0.3);
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 0.5rem;
    }
    .friend-list-container .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .friend-list-container .header h3 { color: #94a3b8; font-weight: 600; }
    .refresh-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8;
      padding: 0.2rem 0.8rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .refresh-btn:hover { background:rgba(255,255,255,0.1); color:#f1f5f9; }
    .friend-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid transparent;
      margin-bottom: 0.3rem;
    }
    .friend-item:hover { background:rgba(255,255,255,0.04); }
    .friend-item .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #fff;
    }
    .friend-item .info { flex:1; }
    .friend-item .info .name { font-weight:600; font-size:0.95rem; }
    .friend-item .info .last-msg { font-size:0.75rem; color:#64748b; }
    .debug-box {
      background: rgba(0,0,0,0.3);
      padding: 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.5rem;
      font-family: monospace;
      word-break: break-all;
    }
    .chat-area { display: none; flex:1; flex-direction:column; background:rgba(30,41,59,0.3); border-radius:1rem; border:1px solid rgba(255,255,255,0.06); overflow:hidden; margin-top:0.5rem; }
    .chat-header { padding:0.8rem 1.2rem; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:0.8rem; font-weight:600; }
    .chat-header .avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#8b5cf6); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; color:#fff; }
    .chat-messages { flex:1; padding:1rem 1.2rem; overflow-y:auto; display:flex; flex-direction:column; gap:0.5rem; min-height:200px; }
    .chat-messages .msg { max-width:75%; padding:0.6rem 0.9rem; border-radius:12px; word-wrap:break-word; line-height:1.5; font-size:0.9rem; }
    .chat-messages .msg.sent { align-self:flex-end; background:#3b82f6; color:#fff; border-bottom-right-radius:4px; }
    .chat-messages .msg.received { align-self:flex-start; background:rgba(255,255,255,0.08); color:#e2e8f0; border-bottom-left-radius:4px; }
    .chat-messages .msg .time { font-size:0.6rem; opacity:0.6; display:block; margin-top:0.2rem; text-align:right; }
    .chat-input { display:flex; gap:0.5rem; padding:0.8rem 1.2rem; border-top:1px solid rgba(255,255,255,0.06); background:rgba(15,23,42,0.3); }
    .chat-input input { flex:1; padding:0.6rem 1rem; background:rgba(15,23,42,0.4); border:1px solid rgba(255,255,255,0.08); border-radius:20px; color:#f1f5f9; font-size:0.9rem; outline:none; }
    .chat-input input:focus { border-color:#3b82f6; }
    .chat-input button { padding:0.5rem 1rem; background:linear-gradient(135deg,#3b82f6,#2563eb); border:none; border-radius:50%; color:#fff; cursor:pointer; width:44px; height:44px; display:flex; align-items:center; justify-content:center; }
    .placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#64748b; padding:2rem; text-align:center; }
    .placeholder i { font-size:3rem; color:#334155; margin-bottom:1rem; }
    .loading { text-align:center; padding:1rem; color:#64748b; }
    .loading i { animation:spin 1s linear infinite; margin-right:0.5rem; }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:#1e293b; border:1px solid #334155; color:#f1f5f9; padding:10px 22px; border-radius:12px; font-size:13px; box-shadow:0 10px 40px rgba(0,0,0,0.7); opacity:0; transition:opacity 0.35s ease, transform 0.35s ease; pointer-events:none; z-index:9999; max-width:90%; font-weight:500; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
    .toast.success { border-left:4px solid #22c55e; }
    .toast.error { border-left:4px solid #ef4444; }
  </style>
</head>
<body>

<div class="wrapper">
  <nav class="navbar">
    <a href="dashboard.html" class="logo"><i class="fas fa-coins"></i> EarnSphere</a>
    <div class="nav-right">
      <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> <span>Back</span></a>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <!-- FRIEND LIST -->
  <div class="friend-list-container">
    <div class="header">
      <h3><i class="fas fa-user-friends"></i> Friends</h3>
      <button class="refresh-btn" onclick="loadFriends()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
    <div id="friendList">
      <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    </div>
    <div id="debugInfo" class="debug-box">🔍 Debug: Waiting for data...</div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chatArea" style="display:none;">
    <div class="chat-header" id="chatHeader">
      <div class="avatar" id="chatAvatar">U</div>
      <span class="name" id="chatName">Friend</span>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="placeholder">
        <i class="fas fa-comment-dots"></i>
        <p>Select a friend to start chatting</p>
      </div>
    </div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
    authDomain: "earnspherehub-742e9.firebaseapp.com",
    projectId: "earnspherehub-742e9",
    storageBucket: "earnspherehub-742e9.firebasestorage.app",
    messagingSenderId: "173538573377",
    appId: "1:173538573377:web:6d8c748376afcb9096dac0"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let currentFriendId = null;
  let chatUnsubscribe = null;
  let friendList = [];

  function showToast(msg, type='success') {
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.className='toast '+type;
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide=setTimeout(()=>t.classList.remove('show'),4000);
  }

  function logout() {
    if(chatUnsubscribe) chatUnsubscribe();
    auth.signOut().then(()=>{ window.location.href='login.html'; });
  }

  // ============================================================
  // LOAD FRIENDS – EXACTLY THE SAME AS COMMUNITY
  // ============================================================
  async function loadFriends() {
    if(!currentUser) {
      document.getElementById('friendList').innerHTML = `<div class="loading">Not logged in</div>`;
      document.getElementById('debugInfo').textContent = '🔍 No user logged in.';
      return;
    }

    const list = document.getElementById('friendList');
    const debug = document.getElementById('debugInfo');
    list.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
    debug.textContent = `🔍 Your UID: ${currentUser.uid}`;

    try {
      // Query as sender (exactly like community)
      const snap1 = await db.collection('friends')
        .where('uid', '==', currentUser.uid)
        .where('status', '==', 'accepted')
        .get();

      // Query as receiver (exactly like community)
      const snap2 = await db.collection('friends')
        .where('friendId', '==', currentUser.uid)
        .where('status', '==', 'accepted')
        .get();

      debug.textContent += `\nSender: ${snap1.size}, Receiver: ${snap2.size}`;

      const friendIds = [];
      snap1.forEach(doc => {
        const data = doc.data();
        friendIds.push(data.friendId);
        debug.textContent += `\nSender doc: friendId=${data.friendId}`;
      });
      snap2.forEach(doc => {
        const data = doc.data();
        friendIds.push(data.uid);
        debug.textContent += `\nReceiver doc: uid=${data.uid}`;
      });

      if(friendIds.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:1rem; color:#64748b;">
          <i class="fas fa-user-friends" style="font-size:2rem; display:block; margin-bottom:0.5rem; color:#334155;"></i>
          No friends yet. Add friends from the Community page.
        </div>`;
        return;
      }

      // Get user details for each friend
      let html = '';
      for(const uid of friendIds) {
        try {
          const doc = await db.collection('users').doc(uid).get();
          if(!doc.exists) continue;
          const data = doc.data();
          const isAdmin = data.isAdmin === true;
          const avatarChar = (data.displayName || 'U').charAt(0).toUpperCase();
          html += `
            <div class="friend-item" onclick="selectFriend('${uid}')">
              <div class="avatar" style="background:${isAdmin ? 'linear-gradient(135deg, #fbbf24, #f59e0b)' : 'linear-gradient(135deg, #3b82f6, #8b5cf6)'}; color:${isAdmin ? '#000' : '#fff'};">
                ${avatarChar}
              </div>
              <div class="info">
                <div class="name">${data.displayName || 'Unknown'} ${isAdmin ? '👑' : ''}</div>
                <div class="last-msg">Click to chat</div>
              </div>
            </div>
          `;
        } catch(e) {
          console.warn('Error loading user:', uid, e);
        }
      }
      list.innerHTML = html || `<div style="color:#64748b;">No friends found.</div>`;

    } catch(err) {
      console.error('Load friends error:', err);
      list.innerHTML = `<div style="color:#ef4444;">Error: ${err.message}</div>`;
      debug.textContent += `\n❌ Error: ${err.message}`;
      showToast('❌ Error loading friends.', 'error');
    }
  }

  // ============================================================
  // SELECT FRIEND
  // ============================================================
  function selectFriend(friendId) {
    if(chatUnsubscribe) chatUnsubscribe();
    currentFriendId = friendId;
    document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
    const el = document.querySelector(`.friend-item[onclick="selectFriend('${friendId}')"]`);
    if(el) el.classList.add('active');

    // Show chat area
    document.getElementById('chatArea').style.display = 'flex';

    // Update header
    db.collection('users').doc(friendId).get().then(doc => {
      if(doc.exists) {
        const data = doc.data();
        const isAdmin = data.isAdmin === true;
        document.getElementById('chatAvatar').textContent = (data.displayName || 'U').charAt(0).toUpperCase();
        document.getElementById('chatAvatar').style.background = isAdmin ? 'linear-gradient(135deg, #fbbf24, #f59e0b)' : 'linear-gradient(135deg, #3b82f6, #8b5cf6)';
        document.getElementById('chatAvatar').style.color = isAdmin ? '#000' : '#fff';
        document.getElementById('chatName').textContent = data.displayName || 'Unknown';
      }
    });

    loadMessages(friendId);
  }

  // ============================================================
  // LOAD MESSAGES
  // ============================================================
  function loadMessages(friendId) {
    const messages = document.getElementById('chatMessages');
    const chatId = [currentUser.uid, friendId].sort().join('_');

    if(chatUnsubscribe) chatUnsubscribe();

    chatUnsubscribe = db.collection('messages')
      .where('chatId', '==', chatId)
      .orderBy('timestamp', 'asc')
      .onSnapshot(snapshot => {
        const container = messages;
        container.innerHTML = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const isSent = data.senderId === currentUser.uid;
          const timeStr = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          container.innerHTML += `
            <div class="msg ${isSent ? 'sent' : 'received'}">
              ${data.message}
              <span class="time">${timeStr}</span>
            </div>
          `;
        });
        container.scrollTop = container.scrollHeight;

        // Mark as read
        snapshot.forEach(doc => {
          const data = doc.data();
          if(data.receiverId === currentUser.uid && !data.read) {
            db.collection('messages').doc(doc.id).update({ read: true });
          }
        });
      });
  }

  // ============================================================
  // SEND MESSAGE
  // ============================================================
  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if(!text || !currentFriendId) return;

    const chatId = [currentUser.uid, currentFriendId].sort().join('_');
    try {
      await db.collection('messages').add({
        chatId: chatId,
        senderId: currentUser.uid,
        receiverId: currentFriendId,
        message: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false
      });
      input.value = '';
    } catch(e) {
      showToast('❌ Error sending message.', 'error');
    }
  }

  document.getElementById('messageInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') { e.preventDefault(); sendMessage(); }
  });

  // ============================================================
  // AUTH
  // ============================================================
  auth.onAuthStateChanged(async (user) => {
    if(user) {
      currentUser = user;
      // First load friends
      await loadFriends();
    } else {
      window.location.href = 'login.html';
    }
  });

  window.loadFriends = loadFriends;
  window.selectFriend = selectFriend;
  window.sendMessage = sendMessage;
  window.logout = logout;
</script>

</body>
</html>
