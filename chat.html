<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Chat – EarnSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }
    .wrapper {
      width: 100%;
      max-width: 700px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background: rgba(30,41,59,.8);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .navbar .logo { font-size:1.4rem; font-weight:800; background:linear-gradient(135deg,#3b82f6,#10b981); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
    .navbar .logo i { margin-right:0.3rem; }
    .navbar .nav-right { display:flex; align-items:center; gap:0.8rem; }
    .navbar .logout-btn { background:rgba(59,130,246,.2); border:1px solid rgba(59,130,246,.3); padding:0.35rem 0.9rem; border-radius:2rem; color:#3b82f6; cursor:pointer; font-size:0.8rem; }
    .navbar .logout-btn:hover { background:rgba(59,130,246,.3); }
    .navbar .back-link { color:#94a3b8; text-decoration:none; font-size:0.85rem; display:flex; align-items:center; gap:0.4rem; }
    .navbar .back-link:hover { color:#f1f5f9; }

    .friends-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .friend-card {
      background: rgba(30,41,59,0.5);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 1rem;
      padding: 1.2rem;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
    }
    .friend-card:hover {
      transform: translateY(-3px);
      border-color: rgba(59,130,246,0.3);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .friend-card .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 0.5rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
      color: #fff;
    }
    .friend-card .avatar.admin { background: linear-gradient(135deg, #fbbf24, #f59e0b); color:#000; }
    .friend-card .name { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.2rem; }
    .friend-card .status { font-size: 0.75rem; color: #10b981; }
    .friend-card .admin-badge { font-size: 0.6rem; background:rgba(251,191,36,0.2); color:#fbbf24; padding:0.1rem 0.5rem; border-radius:12px; display:inline-block; margin-top:0.2rem; }

    .empty-state { text-align:center; padding:3rem 1.5rem; color:#64748b; }
    .empty-state i { font-size:3rem; color:#334155; display:block; margin-bottom:0.5rem; }
    .empty-state p { font-size:0.95rem; }

    .loading { display:flex; justify-content:center; align-items:center; padding:2rem; color:#64748b; }
    .loading i { animation:spin 1s linear infinite; margin-right:0.5rem; }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

    .ad-container {
      max-width: 728px;
      margin: 20px auto;
      padding: 12px;
      background: rgba(30, 41, 59, 0.4);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      z-index: 9999;
      max-width: 90%;
      font-weight: 500;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
    .toast.success { border-left:4px solid #22c55e; }
    .toast.error { border-left:4px solid #ef4444; }

    @media (max-width: 480px) {
      .friends-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <nav class="navbar">
    <a href="dashboard.html" class="logo"><i class="fas fa-coins"></i> EarnSphere</a>
    <div class="nav-right">
      <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> <span>Back</span></a>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <h2 style="margin-bottom:0.5rem;"><i class="fas fa-user-friends"></i> Your Friends</h2>
  <p style="color:#94a3b8; margin-bottom:1rem;">Click a friend to start a private chat</p>

  <!-- ===== MONDIAD BANNER AD 1 ===== -->
  <div class="ad-container">
    <script async src="https://ss.mrmnd.com/banner.js"></script>
    <div data-mndbanid="ee223c23-4173-4698-8e9c-26d4f3650c42"></div>
  </div>

  <div id="friendsContainer">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading friends...</div>
  </div>

  <!-- ===== MONDIAD BANNER AD 2 ===== -->
  <div class="ad-container">
    <script async src="https://ss.mrmnd.com/banner.js"></script>
    <div data-mndbanid="ee223c23-4173-4698-8e9c-26d4f3650c42"></div>
  </div>
</div>

<!-- ===== MONDIAD POP-UNDER ===== -->
<script async src="https://ss.mrmnd.com/popunder.js" data-mndpopid="a8aff8ff-2bef-4fee-baed-136632057710"></script>

<!-- ===== MONDIAD STATIC ===== -->
<script async src="https://ss.mrmnd.com/static/50a5a986-052e-4ac4-acea-2d9bc37b53f3.js"></script>

<!-- ===== MONDIAD NATIVE ===== -->
<script async src="https://ss.mrmnd.com/native.js"></script>
<div data-mndazid="3e2075d4-e0ca-4589-b3a6-57960eb2fcd0"></div>

<!-- ===== MONDIAD DYNAMIC ===== -->
<script async src="https://ss.mrmnd.com/dynamic.js" data-mnddynid="a26ab055-a0eb-469b-98b1-ce863bec9ba7"></script>

<!-- ===== MONDIAD INTERSTITIAL ===== -->
<script async src="https://ss.mrmnd.com/interstitial.js" data-mndintid="c60da3d3-0ed9-41fc-bf0d-23b11a6002f0"></script>

<div id="toast" class="toast"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
    authDomain: "earnspherehub-742e9.firebaseapp.com",
    projectId: "earnspherehub-742e9",
    storageBucket: "earnspherehub-742e9.firebasestorage.app",
    messagingSenderId: "173538573377",
    appId: "1:173538573377:web:6d8c748376afcb9096dac0"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;

  function showToast(msg, type='success') {
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.className='toast '+type;
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide=setTimeout(()=>t.classList.remove('show'),4000);
  }

  function logout() {
    auth.signOut().then(()=>{ window.location.href='login.html'; });
  }

  async function loadFriends() {
    if(!currentUser) {
      document.getElementById('friendsContainer').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Please log in.</p></div>`;
      return;
    }

    const container = document.getElementById('friendsContainer');
    container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';

    try {
      const snap1 = await db.collection('friends')
        .where('uid', '==', currentUser.uid)
        .where('status', '==', 'accepted')
        .get();

      const snap2 = await db.collection('friends')
        .where('friendId', '==', currentUser.uid)
        .where('status', '==', 'accepted')
        .get();

      const friendIds = [];
      snap1.forEach(doc => friendIds.push(doc.data().friendId));
      snap2.forEach(doc => friendIds.push(doc.data().uid));

      if (friendIds.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-user-friends"></i>
            <p>You have no friends yet.<br />Go to the Community page to add friends.</p>
          </div>
        `;
        return;
      }

      let html = '<div class="friends-grid">';
      for (const uid of friendIds) {
        const doc = await db.collection('users').doc(uid).get();
        if (!doc.exists) continue;
        const data = doc.data();
        const isAdmin = data.isAdmin === true;
        const name = data.displayName || 'Unknown';
        const avatarChar = name.charAt(0).toUpperCase();
        const avatarClass = isAdmin ? 'avatar admin' : 'avatar';

        html += `
          <div class="friend-card" onclick="openChat('${uid}')">
            <div class="${avatarClass}">${avatarChar}</div>
            <div class="name">${name}</div>
            <div class="status"><i class="fas fa-circle" style="font-size:0.4rem;"></i> Online</div>
            ${isAdmin ? '<div class="admin-badge">👑 Admin</div>' : ''}
            <div style="margin-top:0.5rem; font-size:0.8rem; color:#3b82f6;">Click to chat</div>
          </div>
        `;
      }
      html += '</div>';
      container.innerHTML = html;

    } catch (e) {
      console.error(e);
      container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error loading friends: ${e.message}</p></div>`;
      showToast('❌ Error loading friends.', 'error');
    }
  }

  function openChat(friendUid) {
    const url = `dm.html?uid=${friendUid}`;
    window.open(url, '_blank');
  }

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      await loadFriends();
    } else {
      window.location.href = 'login.html';
    }
  });

  window.openChat = openChat;
  window.logout = logout;
</script>

</body>
</html>
