<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Chat – EarnSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(59,130,246,.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(16,185,129,.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .wrapper {
      width: 100%;
      max-width: 900px;
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 80px);
      min-height: 500px;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(30,41,59,.8);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.1);
      border-radius: 1rem;
      margin-bottom: 1rem;
    }
    .navbar .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }
    .navbar .logo i { margin-right: 0.3rem; }
    .navbar .nav-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .navbar .logout-btn {
      background: rgba(59,130,246,.2);
      border: 1px solid rgba(59,130,246,.3);
      padding: 0.35rem 0.9rem;
      border-radius: 2rem;
      font-weight: 500;
      color: #3b82f6;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s;
    }
    .navbar .logout-btn:hover { background: rgba(59,130,246,.3); }
    .navbar .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.3s;
    }
    .navbar .back-link:hover { color: #f1f5f9; }

    /* ===== CHAT LAYOUT ===== */
    .chat-container {
      display: flex;
      flex: 1;
      background: rgba(30,41,59,0.4);
      backdrop-filter: blur(8px);
      border-radius: 1rem;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
      min-height: 400px;
    }

    /* ===== FRIENDS LIST SIDEBAR ===== */
    .friends-sidebar {
      width: 280px;
      background: rgba(15,23,42,0.3);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .friends-sidebar .sidebar-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-weight: 700;
      font-size: 0.9rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .friends-sidebar .sidebar-header .count {
      background: rgba(255,255,255,0.05);
      padding: 0.1rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      color: #64748b;
    }
    .friends-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .friends-list .friend-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid transparent;
    }
    .friends-list .friend-item:hover {
      background: rgba(255,255,255,0.04);
    }
    .friends-list .friend-item.active {
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.2);
    }
    .friends-list .friend-item .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #fff;
      flex-shrink: 0;
    }
    .friends-list .friend-item .avatar.admin {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #000;
    }
    .friends-list .friend-item .info {
      flex: 1;
      min-width: 0;
    }
    .friends-list .friend-item .info .name {
      font-weight: 600;
      font-size: 0.9rem;
      color: #f1f5f9;
    }
    .friends-list .friend-item .info .name .admin-badge {
      font-size: 0.5rem;
      color: #fbbf24;
      margin-left: 0.2rem;
    }
    .friends-list .friend-item .info .last-msg {
      font-size: 0.75rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .friends-list .friend-item .unread-badge {
      background: #3b82f6;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .friends-list .friend-item .time {
      font-size: 0.6rem;
      color: #64748b;
      flex-shrink: 0;
    }
    .empty-friends {
      text-align: center;
      padding: 2rem 1rem;
      color: #64748b;
      font-size: 0.9rem;
    }
    .empty-friends i {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
      color: #334155;
    }

    /* ===== CHAT AREA ===== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(15,23,42,0.15);
    }
    .chat-area .chat-header {
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-weight: 600;
    }
    .chat-area .chat-header .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
      flex-shrink: 0;
    }
    .chat-area .chat-header .avatar.admin {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #000;
    }
    .chat-area .chat-header .name {
      flex: 1;
    }
    .chat-area .chat-header .online-status {
      font-size: 0.7rem;
      color: #10b981;
    }
    .chat-messages {
      flex: 1;
      padding: 1rem 1.2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .chat-messages .msg {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 0.9rem;
    }
    .chat-messages .msg.sent {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-messages .msg.received {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .chat-messages .msg .time {
      font-size: 0.6rem;
      opacity: 0.6;
      display: block;
      margin-top: 0.2rem;
      text-align: right;
    }
    .chat-messages .msg.sent .time { color: rgba(255,255,255,0.7); }
    .chat-messages .msg.received .time { color: #94a3b8; }

    .chat-area .chat-input {
      display: flex;
      gap: 0.5rem;
      padding: 0.8rem 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(15,23,42,0.2);
    }
    .chat-area .chat-input input {
      flex: 1;
      padding: 0.6rem 1rem;
      background: rgba(15,23,42,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      color: #f1f5f9;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }
    .chat-area .chat-input input:focus {
      border-color: #3b82f6;
    }
    .chat-area .chat-input input::placeholder {
      color: #64748b;
    }
    .chat-area .chat-input button {
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .chat-area .chat-input button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(59,130,246,0.3);
    }
    .chat-area .chat-input button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chat-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      padding: 2rem;
      text-align: center;
    }
    .chat-placeholder i {
      font-size: 3rem;
      color: #334155;
      margin-bottom: 1rem;
    }
    .chat-placeholder p {
      font-size: 0.95rem;
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      color: #64748b;
    }
    .loading-spinner i {
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      z-index: 9999;
      max-width: 90%;
      font-weight: 500;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
    .toast.success { border-left: 4px solid #22c55e; }
    .toast.error { border-left: 4px solid #ef4444; }
    .toast.info { border-left: 4px solid #3b82f6; }

    @media (max-width: 768px) {
      .wrapper { height: calc(100vh - 60px); min-height: 400px; }
      .friends-sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06); }
      .chat-container { flex-direction: column; }
      .chat-placeholder { min-height: 200px; }
      .friends-list .friend-item { padding: 0.5rem 0.6rem; }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="dashboard.html" class="logo"><i class="fas fa-coins"></i> EarnSphere</a>
    <div class="nav-right">
      <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> <span>Back</span></a>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <!-- CHAT CONTAINER -->
  <div class="chat-container">
    <!-- Friends Sidebar -->
    <div class="friends-sidebar">
      <div class="sidebar-header">
        <i class="fas fa-user-friends"></i> Friends
        <span class="count" id="friendCount">0</span>
      </div>
      <div class="friends-list" id="friendsList">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading friends...</div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <!-- Chat Header (hidden when no friend selected) -->
      <div class="chat-header" id="chatHeader" style="display:none;">
        <div class="avatar" id="chatAvatar">U</div>
        <span class="name" id="chatName">Friend</span>
        <span class="online-status"><i class="fas fa-circle" style="font-size:0.5rem;"></i> Online</span>
      </div>

      <!-- Messages -->
      <div class="chat-messages" id="chatMessages">
        <div class="chat-placeholder">
          <i class="fas fa-comment-dots"></i>
          <p>Select a friend to start chatting</p>
        </div>
      </div>

      <!-- Chat Input (hidden when no friend selected) -->
      <div class="chat-input" id="chatInputArea" style="display:none;">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  // ============================================================
  // FIREBASE CONFIG
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
    authDomain: "earnspherehub-742e9.firebaseapp.com",
    projectId: "earnspherehub-742e9",
    storageBucket: "earnspherehub-742e9.firebasestorage.app",
    messagingSenderId: "173538573377",
    appId: "1:173538573377:web:6d8c748376afcb9096dac0"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ============================================================
  // GLOBALS
  // ============================================================
  let currentUser = null;
  let friends = [];
  let currentFriendId = null;
  let chatUnsubscribe = null;
  let friendUnsubscribe = null;

  const friendsList = document.getElementById('friendsList');
  const chatMessages = document.getElementById('chatMessages');
  const chatHeader = document.getElementById('chatHeader');
  const chatInputArea = document.getElementById('chatInputArea');
  const messageInput = document.getElementById('messageInput');
  const friendCount = document.getElementById('friendCount');

  // ============================================================
  // TOAST
  // ============================================================
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type;
    void toast.offsetWidth;
    toast.classList.add('show');
    clearTimeout(toast._hide);
    toast._hide = setTimeout(() => toast.classList.remove('show'), 4000);
  }

  // ============================================================
  // LOGOUT
  // ============================================================
  function logout() {
    if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
    if (friendUnsubscribe) { friendUnsubscribe(); friendUnsubscribe = null; }
    auth.signOut().then(() => {
      localStorage.removeItem('earnsphere_user_data');
      window.location.href = 'login.html';
    });
  }

  // ============================================================
  // LOAD FRIENDS (with real-time updates)
  // ============================================================
  function loadFriends() {
    if (!currentUser) return;

    if (friendUnsubscribe) friendUnsubscribe();

    const friendsRef = db.collection('friends')
      .where('status', '==', 'accepted');

    // Query where current user is the sender
    const q1 = friendsRef.where('uid', '==', currentUser.uid);
    // Query where current user is the receiver
    const q2 = friendsRef.where('friendId', '==', currentUser.uid);

    let allFriends = [];

    // We'll use two listeners and combine results
    const unsub1 = q1.onSnapshot((snapshot) => {
      snapshot.docChanges().forEach(() => {});
      const results = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        results.push({ uid: data.friendId, direction: 'sent' });
      });
      // Merge with q2 results
      const unsub2 = q2.onSnapshot((snap2) => {
        snap2.docChanges().forEach(() => {});
        const results2 = [];
        snap2.forEach(doc => {
          const data = doc.data();
          results2.push({ uid: data.uid, direction: 'received' });
        });
        // Combine unique friends
        const combined = [...results, ...results2];
        const unique = combined.filter((v, i, a) => a.findIndex(t => t.uid === v.uid) === i);
        renderFriends(unique);
      });
      friendUnsubscribe = () => { unsub1(); unsub2(); };
    });
  }

  // ============================================================
  // RENDER FRIENDS
  // ============================================================
  async function renderFriends(friendIds) {
    if (!friendIds.length) {
      friendsList.innerHTML = `
        <div class="empty-friends">
          <i class="fas fa-user-friends"></i>
          <p>No friends yet.<br />Go to Community and add friends!</p>
        </div>
      `;
      friendCount.textContent = '0';
      return;
    }

    friendCount.textContent = friendIds.length;

    let html = '';
    for (const { uid } of friendIds) {
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (!doc.exists) continue;
        const data = doc.data();
        const isAdmin = data.isAdmin === true;
        const avatarChar = (data.displayName || 'U').charAt(0).toUpperCase();
        const avatarClass = isAdmin ? 'avatar admin' : 'avatar';

        // Get last message
        const chatId = [currentUser.uid, uid].sort().join('_');
        const lastMsgSnap = await db.collection('messages')
          .where('chatId', '==', chatId)
          .orderBy('timestamp', 'desc')
          .limit(1)
          .get();

        let lastMsg = 'No messages yet';
        let lastTime = '';
        let unreadCount = 0;

        if (!lastMsgSnap.empty) {
          const msgData = lastMsgSnap.docs[0].data();
          lastMsg = msgData.message;
          const ts = msgData.timestamp ? msgData.timestamp.toDate() : new Date();
          lastTime = ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Count unread messages
        const unreadSnap = await db.collection('messages')
          .where('chatId', '==', chatId)
          .where('receiverId', '==', currentUser.uid)
          .where('read', '==', false)
          .get();
        unreadCount = unreadSnap.size;

        html += `
          <div class="friend-item ${currentFriendId === uid ? 'active' : ''}" onclick="selectFriend('${uid}')">
            <div class="${avatarClass}">${avatarChar}</div>
            <div class="info">
              <div class="name">${data.displayName || 'Unknown'} ${isAdmin ? '<span class="admin-badge"><i class="fas fa-crown"></i></span>' : ''}</div>
              <div class="last-msg">${lastMsg}</div>
            </div>
            ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
            <span class="time">${lastTime}</span>
          </div>
        `;
      } catch (e) {
        console.error(e);
      }
    }
    friendsList.innerHTML = html || `
      <div class="empty-friends">
        <i class="fas fa-user-friends"></i>
        <p>No friends found.</p>
      </div>
    `;

    // If a friend was selected, re-select to refresh messages
    if (currentFriendId) {
      const stillFriend = friendIds.some(f => f.uid === currentFriendId);
      if (!stillFriend) {
        currentFriendId = null;
        showChatPlaceholder();
      } else {
        loadMessages(currentFriendId);
      }
    }
  }

  // ============================================================
  // SELECT FRIEND
  // ============================================================
  function selectFriend(friendId) {
    if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
    currentFriendId = friendId;
    loadMessages(friendId);
    // Update active state
    document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.friend-item[onclick="selectFriend('${friendId}')"]`)?.classList.add('active');
  }

  // ============================================================
  // SHOW CHAT PLACEHOLDER
  // ============================================================
  function showChatPlaceholder() {
    chatHeader.style.display = 'none';
    chatInputArea.style.display = 'none';
    chatMessages.innerHTML = `
      <div class="chat-placeholder">
        <i class="fas fa-comment-dots"></i>
        <p>Select a friend to start chatting</p>
      </div>
    `;
  }

  // ============================================================
  // LOAD MESSAGES (real-time)
  // ============================================================
  function loadMessages(friendId) {
    if (!currentUser) return;

    // Show chat header
    chatHeader.style.display = 'flex';
    chatInputArea.style.display = 'flex';

    // Get friend info
    db.collection('users').doc(friendId).get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        const isAdmin = data.isAdmin === true;
        const avatarChar = (data.displayName || 'U').charAt(0).toUpperCase();
        document.getElementById('chatAvatar').textContent = avatarChar;
        document.getElementById('chatAvatar').className = isAdmin ? 'avatar admin' : 'avatar';
        document.getElementById('chatName').textContent = data.displayName || 'Unknown';
      }
    });

    // Clear messages
    chatMessages.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading messages...</div>';

    const chatId = [currentUser.uid, friendId].sort().join('_');

    if (chatUnsubscribe) chatUnsubscribe();

    chatUnsubscribe = db.collection('messages')
      .where('chatId', '==', chatId)
      .orderBy('timestamp', 'asc')
      .onSnapshot((snapshot) => {
        const container = chatMessages;
        container.innerHTML = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const isSent = data.senderId === currentUser.uid;
          const timeStr = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          container.innerHTML += `
            <div class="msg ${isSent ? 'sent' : 'received'}">
              ${data.message}
              <span class="time">${timeStr}</span>
            </div>
          `;
        });
        container.scrollTop = container.scrollHeight;

        // Mark messages as read
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.receiverId === currentUser.uid && !data.read) {
            db.collection('messages').doc(doc.id).update({ read: true });
          }
        });

        // Update unread badges in friends list
        loadFriends();
      });
  }

  // ============================================================
  // SEND MESSAGE
  // ============================================================
  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentFriendId) return;

    const chatId = [currentUser.uid, currentFriendId].sort().join('_');

    try {
      await db.collection('messages').add({
        chatId: chatId,
        senderId: currentUser.uid,
        receiverId: currentFriendId,
        message: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false
      });
      messageInput.value = '';
    } catch (e) {
      console.error(e);
      showToast('❌ Error sending message.', 'error');
    }
  }

  // ============================================================
  // ENTER KEY TO SEND
  // ============================================================
  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // ============================================================
  // AUTH & INIT
  // ============================================================
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      await loadFriends();
      showChatPlaceholder();
    } else {
      window.location.href = 'login.html';
    }
  });

  // Expose functions globally
  window.selectFriend = selectFriend;
  window.sendMessage = sendMessage;
  window.logout = logout;
</script>

</body>
</html>
