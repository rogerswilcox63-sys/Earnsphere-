<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch an Ad - EarnSphere</title>
  <link href="https://googleapis.com" rel="stylesheet" />
  <link rel="stylesheet" href="https://cloudflare.com" />
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <style>
    body { font-family:'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); min-height:100vh; color:#f1f5f9; padding:2rem; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .container { max-width:500px; background:rgba(30,41,59,.6); backdrop-filter:blur(12px); border-radius:1rem; padding:2rem; border:1px solid rgba(255,255,255,.1); text-align:center; width:100%; }
    .back-link { color:#3b82f6; text-decoration:none; display:inline-block; margin-bottom:1rem; float:left; }
    .back-link:hover { text-decoration:underline; }
    h1 { margin-bottom:.5rem; }
    .reward-badge { background:rgba(16,185,129,.2); color:#10b981; padding:.25rem .75rem; border-radius:.25rem; font-size:.9rem; display:inline-block; margin:1rem 0; }
    .timer-text { font-size:2rem; font-weight:700; color:#f59e0b; margin:1.5rem 0; }
    .btn-primary { background:linear-gradient(135deg, #3b82f6, #2563eb); border:none; color:#fff; padding:1rem; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; width:100%; margin-top:.5rem; transition:all 0.3s; }
    .btn-primary:hover:not(:disabled) { transform:scale(1.02); }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-success { background:linear-gradient(135deg, #10b981, #059669); }
    .toast { background:rgba(30,41,59,.95); padding:1rem 1.5rem; border-radius:.5rem; border:1px solid rgba(16,185,129,.3); color:#fff; animation:slideIn 0.3s ease; box-shadow:0 4px 15px rgba(0,0,0,.3); position:fixed; top:20px; right:20px; z-index:9999; max-width:90%; }
    @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

    .ad-placeholder {
      max-width: 100%;
      margin: 1.5rem auto;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.1);
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
    <h1><i class="fas fa-play"></i> Watch an Ad</h1>
    <p>Watch a short ad and earn <strong>₦50</strong>!</p>
    <div class="reward-badge"><i class="fas fa-coins"></i> Reward: ₦50 per day</div>

    <!-- Ad Wrapper -->
    <div class="ad-placeholder">
      <script id="aclib" type="text/javascript" src="//://acscdn.com"></script>
      <script type="text/javascript">
          aclib.runVideoSlider({
              zoneId: '11851230',
          });
      </script>
    </div>

    <div id="timerDisplay" class="timer-text">⏳ 10 seconds</div>

    <!-- Interface Action Toggles -->
    <button class="btn-primary" id="startBtn" onclick="watchAd()"><i class="fas fa-play"></i> Start Watching</button>
    <button class="btn-primary btn-success" id="claimBtn" style="display:none;" onclick="claimReward()"><i class="fas fa-check"></i> Claim ₦50</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
      authDomain: "://firebaseapp.com",
      projectId: "earnspherehub-742e9",
      storageBucket: "earnspherehub-742e9.firebasestorage.app",
      messagingSenderId: "173538573377",
      appId: "1:173538573377:web:6d8c748376afcb9096dac0"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userData = { balance:0, lifetimeTotal:0, successfulTaskCount:0, completedTasks:{} };
    let adTimer;
    let seconds = 10;

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = msg;
      document.body.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    function getTodayDateString() {
      return new Date().toISOString().split('T')[0];
    }

    function isCompletedToday(taskId) {
      if (!userData.completedTasks || !userData.completedTasks[taskId]) return false;
      const completedDate = new Date(userData.completedTasks[taskId]).toISOString().split('T')[0];
      return completedDate === getTodayDateString();
    }

    async function loadUserData(uid) {
      const doc = await db.collection('users').doc(uid).get();
      if (doc.exists) {
        userData = doc.data();
        const taskId = 'extra_ad';
        if (isCompletedToday(taskId)) {
          document.getElementById('startBtn').disabled = true;
          document.getElementById('startBtn').innerHTML = '✅ Completed Today';
        }
      }
    }

    function watchAd() {
      const startBtn = document.getElementById('startBtn');
      const claimBtn = document.getElementById('claimBtn');
      const timerDisplay = document.getElementById('timerDisplay');

      startBtn.disabled = true;
      startBtn.innerHTML = '⏳ Watching...';
      seconds = 10;
      timerDisplay.textContent = `⏳ ${seconds} seconds`;

      adTimer = setInterval(() => {
        seconds--;
        timerDisplay.textContent = `⏳ ${seconds} seconds`;
        if (seconds <= 0) {
          clearInterval(adTimer);
          timerDisplay.textContent = '🎉 Ad Complete!';
          startBtn.style.display = 'none';
          claimBtn.style.display = 'block'; // Reveals the interactive claim action
        }
      }, 1000);
    }

    async function claimReward() {
      const user = auth.currentUser;
      if (!user) {
        showToast('⚠️ Please log in.');
        return;
      }

      // 1. Instantly opens the ad destination in a new tab upon user click.
      // This click action cleanly bypasses all web browser popup blockers.
      window.open('https://://acscdn.com', '_blank');

      await loadUserData(user.uid);
      const taskId = 'extra_ad';
      if (isCompletedToday(taskId)) {
        showToast('⚠️ You already claimed your ad reward today!');
        return;
      }

      if (!userData.completedTasks) userData.completedTasks = {};
      userData.completedTasks[taskId] = Date.now();
      const reward = 50;
      userData.balance = (userData.balance || 0) + reward;
      userData.lifetimeTotal = (userData.lifetimeTotal || 0) + reward;
      userData.successfulTaskCount = (userData.successfulTaskCount || 0) + 1;

      try {
        const claimBtn = document.getElementById('claimBtn');
        claimBtn.disabled = true;
        claimBtn.innerHTML = '⏳ Processing...';

        await db.collection('users').doc(user.uid).set(userData, { merge: true });
        showToast(`🎉 Ad reward claimed! +₦${reward} earned!`);
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);
      } catch (error) {
        showToast('⚠️ Error claiming reward. Please try again.');
        document.getElementById('claimBtn').disabled = false;
        document.getElementById('claimBtn').innerHTML = '<i class="fas fa-check"></i> Claim ₦50';
      }
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) await loadUserData(user.uid);
    });
  </script>
</body>
</html>
