<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>🏆 Leaderboard – EarnSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js">
    </script>
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(145deg, #0b1120 0%, #1a2332 50%, #0b1120 100%);
            min-height: 100vh;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem 2rem;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 10% 30%, rgba(59, 130, 246, .07) 0%, transparent 50%),
                radial-gradient(circle at 90% 70%, rgba(16, 185, 129, .07) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .wrapper {
            width: 100%;
            max-width: 820px;
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ─── HEADER ─── */
        .header {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .header .logo {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            margin-bottom: 0.2rem;
        }
        .header .logo i {
            margin-right: 0.3rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .header h1 i {
            color: #fbbf24;
            font-size: 1.6rem;
        }
        .header .sub {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }
        .header .filter-badge {
            display: inline-block;
            margin-top: 0.5rem;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 0.25rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #10b981;
            font-weight: 600;
        }
        .header .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.4rem 1rem 0.4rem 0.8rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .header .user-badge i {
            color: #3b82f6;
        }

        /* ─── TOOLBAR ─── */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .toolbar .btn-refresh {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: inherit;
        }
        .toolbar .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .toolbar .btn-refresh:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ─── TABS ─── */
        .tabs {
            display: flex;
            gap: 0.4rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            padding: 0.35rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tabs .tab {
            padding: 0.5rem 1.2rem;
            border-radius: 0.75rem;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }
        .tabs .tab i {
            font-size: 0.85rem;
        }
        .tabs .tab:hover {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.04);
        }
        .tabs .tab.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
        }

        /* ─── PODIUM ─── */
        .podium {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }
        .podium-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1rem 0.8rem 0.9rem;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .podium-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .podium-card .rank-icon {
            font-size: 1.8rem;
            margin-bottom: 0.2rem;
        }
        .podium-card .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            margin: 0 auto 0.4rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .podium-card .podium-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .podium-card .podium-value {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .podium-card .podium-value strong {
            color: #f1f5f9;
            font-weight: 600;
        }
        .podium-card .podium-badge {
            position: absolute;
            top: 0.4rem;
            right: 0.6rem;
            font-size: 0.6rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            color: #94a3b8;
        }
        .podium-card.gold {
            border-color: rgba(251, 191, 36, 0.3);
            background: rgba(251, 191, 36, 0.06);
        }
        .podium-card.gold .avatar {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }
        .podium-card.silver {
            border-color: rgba(148, 163, 184, 0.2);
            background: rgba(148, 163, 184, 0.05);
        }
        .podium-card.silver .avatar {
            background: linear-gradient(135deg, #94a3b8, #64748b);
        }
        .podium-card.bronze {
            border-color: rgba(180, 130, 80, 0.25);
            background: rgba(180, 130, 80, 0.05);
        }
        .podium-card.bronze .avatar {
            background: linear-gradient(135deg, #cd7f32, #b87333);
        }
        .podium-card .you-tag {
            font-size: 0.55rem;
            font-weight: 700;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            display: inline-block;
            margin-top: 0.2rem;
        }

        /* ─── LIST ─── */
        .list-container {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 1.2rem;
            overflow: hidden;
        }
        .list-header {
            display: grid;
            grid-template-columns: 50px 1fr 1.2fr 0.8fr;
            padding: 0.7rem 1.2rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(0, 0, 0, 0.15);
        }
        .list-header .lh-rank {
            text-align: center;
        }
        .list-header .lh-user {
            padding-left: 0.3rem;
        }
        .list-header .lh-value {
            text-align: right;
        }
        .list-header .lh-meta {
            text-align: right;
            display: none;
        }

        .list-item {
            display: grid;
            grid-template-columns: 50px 1fr 1.2fr 0.8fr;
            padding: 0.7rem 1.2rem;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
            font-size: 0.85rem;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .list-item .rank-num {
            text-align: center;
            font-weight: 700;
            color: #64748b;
            font-size: 0.8rem;
        }
        .list-item .rank-num.top1 {
            color: #fbbf24;
        }
        .list-item .rank-num.top2 {
            color: #94a3b8;
        }
        .list-item .rank-num.top3 {
            color: #cd7f32;
        }

        .list-item .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding-left: 0.3rem;
        }
        .list-item .user-info .mini-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #fff;
            flex-shrink: 0;
        }
        .list-item .user-info .uname {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-item .user-info .you-badge {
            font-size: 0.55rem;
            font-weight: 700;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            padding: 0.05rem 0.5rem;
            border-radius: 10px;
            margin-left: 0.2rem;
            flex-shrink: 0;
        }

        .list-item .metric-value {
            text-align: right;
            font-weight: 600;
            color: #f1f5f9;
        }
        .list-item .metric-value .currency {
            font-weight: 400;
            color: #94a3b8;
            font-size: 0.7rem;
        }

        .list-item .meta-stats {
            text-align: right;
            font-size: 0.7rem;
            color: #64748b;
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .list-item .meta-stats span {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
        }
        .list-item .meta-stats i {
            font-size: 0.6rem;
            color: #3b82f6;
        }

        .list-item.is-you {
            background: rgba(59, 130, 246, 0.06);
            border-left: 3px solid #3b82f6;
            border-radius: 0 0.4rem 0.4rem 0;
        }

        /* ─── EMPTY / LOADING ─── */
        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
            color: #64748b;
        }
        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #334155;
        }
        .empty-state p {
            font-size: 0.95rem;
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            gap: 0.6rem;
            color: #64748b;
        }
        .loading-spinner i {
            font-size: 1.5rem;
            color: #3b82f6;
        }

        /* ─── FOOTER ─── */
        .footer {
            margin-top: 2.5rem;
            padding: 1rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            font-size: 0.7rem;
            color: #475569;
        }
        .footer .links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-bottom: 0.4rem;
        }
        .footer .links a {
            color: #475569;
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer .links a:hover {
            color: #3b82f6;
        }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
            z-index: 9999;
            max-width: 90%;
            font-weight: 500;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .toast.success {
            border-left: 4px solid #22c55e;
        }
        .toast.error {
            border-left: 4px solid #ef4444;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 640px) {
            .podium {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 0.5rem;
            }
            .podium-card {
                padding: 0.7rem 0.4rem;
            }
            .podium-card .avatar {
                width: 36px;
                height: 36px;
                font-size: 0.8rem;
            }
            .podium-card .podium-name {
                font-size: 0.75rem;
            }
            .podium-card .podium-value {
                font-size: 0.65rem;
            }
            .podium-card .rank-icon {
                font-size: 1.3rem;
            }
            .list-header {
                grid-template-columns: 36px 1fr 0.8fr;
                font-size: 0.6rem;
                padding: 0.5rem 0.8rem;
            }
            .list-header .lh-meta {
                display: none;
            }
            .list-item {
                grid-template-columns: 36px 1fr 0.8fr;
                padding: 0.5rem 0.8rem;
                font-size: 0.75rem;
            }
            .list-item .meta-stats {
                display: none;
            }
            .list-item .user-info .mini-avatar {
                width: 24px;
                height: 24px;
                font-size: 0.6rem;
            }
            .tabs .tab {
                font-size: 0.7rem;
                padding: 0.35rem 0.7rem;
            }
            .tabs .tab i {
                font-size: 0.7rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
        }
        @media (max-width: 420px) {
            .podium {
                grid-template-columns: 1fr;
                gap: 0.4rem;
                max-width: 260px;
                margin-left: auto;
                margin-right: auto;
            }
            .podium-card {
                display: flex;
                align-items: center;
                gap: 0.8rem;
                padding: 0.5rem 0.8rem;
                text-align: left;
            }
            .podium-card .rank-icon {
                font-size: 1.2rem;
                margin-bottom: 0;
            }
            .podium-card .avatar {
                width: 32px;
                height: 32px;
                font-size: 0.7rem;
                margin: 0;
            }
            .podium-card .podium-badge {
                display: none;
            }
            .podium-card .podium-name {
                font-size: 0.75rem;
            }
            .podium-card .podium-value {
                font-size: 0.65rem;
            }
            .podium-card .you-tag {
                font-size: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- HEADER -->
        <div class="header">
            <div class="logo"><i class="fas fa-coins"></i> EarnSphere</div>
            <h1>
                <i class="fas fa-trophy"></i>
                Leaderboard
                <i class="fas fa-trophy"></i>
            </h1>
            <p class="sub">See where you stand among the community</p>
            <div class="filter-badge">
                <i class="fas fa-filter"></i> Showing users with balance ₦5,000 and above
            </div>
            <div class="user-badge" id="userBadge">
                <i class="fas fa-user-circle"></i>
                <span id="userNameDisplay">Loading…</span>
                <span style="color:#475569;font-weight:400;">•</span>
                <span id="userRankDisplay" style="color:#3b82f6;">#--</span>
            </div>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <button class="btn-refresh" id="refreshBtn" onclick="loadRankings()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <!-- TABS -->
        <div class="tabs" id="tabContainer">
            <button class="tab active" data-metric="balance"><i class="fas fa-coins"></i> Balance</button>
            <button class="tab" data-metric="referralCount"><i class="fas fa-user-plus"></i> Referrals</button>
            <button class="tab" data-metric="surveysCompleted"><i class="fas fa-poll"></i> Surveys</button>
            <button class="tab" data-metric="tasksCompleted"><i class="fas fa-tasks"></i> Tasks</button>
        </div>

        <!-- PODIUM -->
        <div class="podium" id="podiumContainer">
            <!-- dynamically filled -->
        </div>

        <!-- LIST -->
        <div class="list-container" id="listContainer">
            <div class="list-header">
                <span class="lh-rank">#</span>
                <span class="lh-user">User</span>
                <span class="lh-value" id="headerMetricLabel">Balance</span>
                <span class="lh-meta">Details</span>
            </div>
            <div id="listBody">
                <!-- loading / empty / items -->
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="links">
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="terms.html">Terms of Service</a>
            </div>
            <div class="copyright">
                &copy; 2026 EarnSphere Hub. All rights reserved.
            </div>
        </footer>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCVExwvLDwVmMJ6XbyTCrY1IyMqyhiuLbo",
            authDomain: "earnspherehub-742e9.firebaseapp.com",
            projectId: "earnspherehub-742e9",
            storageBucket: "earnspherehub-742e9.firebasestorage.app",
            messagingSenderId: "173538573377",
            appId: "1:173538573377:web:6d8c748376afcb9096dac0"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // GLOBALS
        // ============================================================
        let currentUser = null;
        let allUsers = []; // all users from Firestore (before filtering)
        let filteredUsers = []; // users with balance >= 5000
        let currentMetric = 'balance';

        const toast = document.getElementById('toast');
        const podiumContainer = document.getElementById('podiumContainer');
        const listBody = document.getElementById('listBody');
        const headerMetricLabel = document.getElementById('headerMetricLabel');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userRankDisplay = document.getElementById('userRankDisplay');
        const refreshBtn = document.getElementById('refreshBtn');

        // ============================================================
        // FILTER: Keep users with balance >= 5000
        // ============================================================
        function applyBalanceFilter(users) {
            return users.filter(user => {
                const balance = user.balance || 0;
                return balance >= 5000;
            });
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================================
        // FETCH REAL USERS FROM FIRESTORE
        // ============================================================
        async function fetchUsers() {
            try {
                const snapshot = await db.collection('users').get();
                const users = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const balance = parseFloat(data.balance) || 0;
                    const referralCount = parseInt(data.referralCount) || 0;
                    const surveysCompleted = parseInt(data.surveysCompleted) || 0;
                    const tasksCompleted = parseInt(data.tasksCompleted) || 0;
                    const displayName = data.displayName || data.name || 'Anonymous';
                    users.push({
                        uid: doc.id,
                        displayName,
                        balance,
                        referralCount,
                        surveysCompleted,
                        tasksCompleted,
                        _avatarChar: displayName.charAt(0).toUpperCase()
                    });
                });
                return users;
            } catch (err) {
                console.error('Error fetching users:', err);
                showToast('❌ Failed to load rankings.', 'error');
                return [];
            }
        }

        // ============================================================
        // RANKING HELPERS
        // ============================================================
        function getSortedUsers(users, metric) {
            const copy = [...users];
            copy.sort((a, b) => {
                const valA = a[metric] ?? 0;
                const valB = b[metric] ?? 0;
                return valB - valA;
            });
            return copy;
        }

        function getRank(users, uid, metric) {
            const sorted = getSortedUsers(users, metric);
            const idx = sorted.findIndex(u => u.uid === uid);
            return idx === -1 ? null : idx + 1;
        }

        // ============================================================
        // RENDER PODIUM (top 3 from filtered list)
        // ============================================================
        function renderPodium(sorted, metric) {
            const top3 = sorted.slice(0, 3);
            const medalIcons = ['🥇', '🥈', '🥉'];
            const medalClasses = ['gold', 'silver', 'bronze'];

            if (top3.length === 0) {
                podiumContainer.innerHTML =
                    `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-users-slash"></i><p>No users with balance ₦5,000 or more</p></div>`;
                return;
            }

            let html = '';
            top3.forEach((user, i) => {
                const value = user[metric] ?? 0;
                const formatted = metric === 'balance' ? `₦${value.toLocaleString()}` : value;
                const isYou = currentUser && user.uid === currentUser.uid;
                html += `
                    <div class="podium-card ${medalClasses[i]}">
                        <div class="rank-icon">${medalIcons[i]}</div>
                        <div class="avatar">${user._avatarChar}</div>
                        <div class="podium-name">${user.displayName}</div>
                        <div class="podium-value"><strong>${formatted}</strong></div>
                        ${isYou ? '<div class="you-tag">You</div>' : ''}
                        <div class="podium-badge">#${i+1}</div>
                    </div>
                `;
            });
            podiumContainer.innerHTML = html;
        }

        // ============================================================
        // RENDER LIST (all filtered users)
        // ============================================================
        function renderList(sorted, metric) {
            const metricLabels = {
                balance: 'Balance',
                referralCount: 'Referrals',
                surveysCompleted: 'Surveys',
                tasksCompleted: 'Tasks'
            };
            headerMetricLabel.textContent = metricLabels[metric] || 'Score';

            if (sorted.length === 0) {
                listBody.innerHTML =
                    `<div class="empty-state"><i class="fas fa-users-slash"></i><p>No users found with balance ₦5,000 or more</p></div>`;
                return;
            }

            let html = '';
            sorted.forEach((user, index) => {
                const rank = index + 1;
                const value = user[metric] ?? 0;
                const formatted = metric === 'balance' ? `₦${value.toLocaleString()}` : value;
                const isYou = currentUser && user.uid === currentUser.uid;

                let rankClass = '';
                if (rank === 1) rankClass = 'top1';
                else if (rank === 2) rankClass = 'top2';
                else if (rank === 3) rankClass = 'top3';

                // Show other metrics in the meta column
                const metaHtml = `
                    <span><i class="fas fa-coins"></i> ${user.balance.toLocaleString()}</span>
                    <span><i class="fas fa-user-plus"></i> ${user.referralCount}</span>
                    <span><i class="fas fa-poll"></i> ${user.surveysCompleted}</span>
                    <span><i class="fas fa-tasks"></i> ${user.tasksCompleted}</span>
                `;

                html += `
                    <div class="list-item ${isYou ? 'is-you' : ''}">
                        <span class="rank-num ${rankClass}">#${rank}</span>
                        <div class="user-info">
                            <div class="mini-avatar">${user._avatarChar}</div>
                            <span class="uname">${user.displayName}</span>
                            ${isYou ? '<span class="you-badge">You</span>' : ''}
                        </div>
                        <div class="metric-value">${formatted}</div>
                        <div class="meta-stats">${metaHtml}</div>
                    </div>
                `;
            });
            listBody.innerHTML = html;

            // Update user badge
            if (currentUser) {
                const userRank = getRank(sorted, currentUser.uid, metric);
                userNameDisplay.textContent = currentUser.displayName || 'You';
                userRankDisplay.textContent = userRank ? `#${userRank}` : '#--';
            }
        }

        // ============================================================
        // MAIN LOAD FUNCTION
        // ============================================================
        async function loadRankings() {
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading…';
            try {
                const users = await fetchUsers();
                allUsers = users;
                // Apply balance filter (>= 5000)
                filteredUsers = applyBalanceFilter(allUsers);

                // Update currentUser info from auth (if available)
                if (currentUser) {
                    const existing = allUsers.find(u => u.uid === currentUser.uid);
                    if (existing) {
                        currentUser.displayName = existing.displayName;
                    } else {
                        // User exists in auth but not in Firestore – show as not ranked
                        userNameDisplay.textContent = currentUser.displayName || 'You';
                        userRankDisplay.textContent = '#--';
                    }
                }

                if (filteredUsers.length === 0) {
                    podiumContainer.innerHTML =
                        `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-users-slash"></i><p>No users with balance ₦5,000 or more</p></div>`;
                    listBody.innerHTML =
                        `<div class="empty-state"><i class="fas fa-users-slash"></i><p>No users found in this range</p></div>`;
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh';
                    return;
                }

                // Sort by current metric and render
                const sorted = getSortedUsers(filteredUsers, currentMetric);
                renderPodium(sorted, currentMetric);
                renderList(sorted, currentMetric);

            } catch (err) {
                console.error(err);
                showToast('❌ Error loading rankings.', 'error');
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh';
            }
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentMetric = this.dataset.metric;
                if (filteredUsers.length) {
                    const sorted = getSortedUsers(filteredUsers, currentMetric);
                    renderPodium(sorted, currentMetric);
                    renderList(sorted, currentMetric);
                } else {
                    loadRankings();
                }
            });
        });

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Fetch user's own data to get display name
                db.collection('users').doc(user.uid).get().then(doc => {
                    let displayName = 'You';
                    if (doc.exists) {
                        const data = doc.data();
                        displayName = data.displayName || data.name || user.displayName || 'You';
                    } else {
                        displayName = user.displayName || 'You';
                    }
                    currentUser = {
                        uid: user.uid,
                        displayName: displayName
                    };
                    loadRankings();
                }).catch(() => {
                    currentUser = {
                        uid: user.uid,
                        displayName: user.displayName || 'You',
                    };
                    loadRankings();
                });
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
